<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Trenażer egzaminacyjny z fizjoterapii. Fiszki, quizy, przypadki praktyczne i próbne egzaminy z materiału wykładowego."
    />
    <title>Trenażer • Fizjoterapia</title>
    <link rel="icon" href="./images/favicon.svg" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Nawigacja">
        <div class="brand">
          <div class="brandmark">✚</div>
          <div>
            <strong>Trenażer</strong><small>Fizjoterapia · egzamin</small>
          </div>
        </div>
        <div>
          <div class="navlabel">NAUKA</div>
          <nav id="desktop-nav"></nav>
        </div>
        <div class="sidebar-foot">
          <b>Twoje postępy</b>
          <div id="side-stats">Wczytywanie…</div>
          <div class="progressline"><i id="side-progress"></i></div>
          <p class="sidebar-source">
            <span id="source-summary"></span><br />Materiał dydaktyczny, nie
            instrukcja kliniczna.
          </p>
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="bread">
            <span>Fizjoterapia</span><span>›</span
            ><b id="crumb">Panel główny</b>
          </div>
          <div class="top-actions">
            <span class="tag" id="storage-indicator">Wczytywanie…</span
            ><button
              class="iconbtn"
              id="theme-toggle"
              type="button"
              title="Zmień motyw"
              aria-label="Zmień motyw"
            >
              ☾
            </button>
          </div>
        </div>
        <div id="root" aria-live="polite"><p>Wczytywanie zestawów…</p></div>
      </main>
    </div>
    <div class="mobile-nav" id="mobile-nav"></div>
    <div class="mobile-menu hidden" id="mobile-menu"></div>
    <div class="toast hidden" id="toast" role="status"></div>
    <input
      class="hidden"
      type="file"
      id="import-file"
      accept="application/json,.json"
    />
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
