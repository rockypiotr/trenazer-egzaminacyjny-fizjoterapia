<script id="study-data" type="application/json">{"cards":[{"id":"F-V-001","kind":"card","lecture":"V","slide":"5","topic":"Postawa i rozwój","difficulty":"basic","priority":false,"question":"Jak w prezentacji zdefiniowano postawę ciała?","answer":"Układ poszczególnych odcinków ciała przyjmowany w swobodnej, niewymuszonej pozycji pionowej."},{"id":"F-V-002","kind":"card","lecture":"V","slide":"6","topic":"Postawa i rozwój","difficulty":"basic","priority":false,"question":"Czym różni się postawa nawykowa od bacznej?","answer":"Nawykowa jest naturalna i niewymuszona; baczna jest świadomie korygowana napięciem mięśni."},{"id":"F-V-003","kind":"card","lecture":"V","slide":"6","topic":"Postawa i rozwój","difficulty":"basic","priority":false,"question":"Który rodzaj postawy powinien być przede wszystkim oceniany w badaniu?","answer":"Postawa nawykowa, ponieważ najlepiej odzwierciedla naturalne ustawienie ciała."},{"id":"F-V-004","kind":"card","lecture":"V","slide":"7","topic":"Postawa i rozwój","difficulty":"basic","priority":false,"question":"Jak powinien być ustawiony kręgosłup w płaszczyźnie czołowej przy prawidłowej postawie?","answer":"Powinien być prosty, bez skrzywienia bocznego."},{"id":"F-V-005","kind":"card","lecture":"V","slide":"7","topic":"Postawa i rozwój","difficulty":"basic","priority":false,"question":"Wymień trzy cechy prawidłowej postawy widoczne od przodu.","answer":"Prosta głowa, barki na jednym poziomie, symetryczna miednica; prawidłowe ustawienie kończyn i stóp."},{"id":"F-V-006","kind":"card","lecture":"V","slide":"8","topic":"Postawa i rozwój","difficulty":"medium","priority":false,"question":"Przez jakie okolice przebiega pion w ocenie prawidłowej postawy z boku?","answer":"Od otworu słuchowego przez stawy ramienny i biodrowy, nieco przed kolanem i stawem skokowym, ku środkowi stóp."},{"id":"F-V-007","kind":"card","lecture":"V","slide":"10","topic":"Postawa i rozwój","difficulty":"basic","priority":true,"question":"Wymień cztery fizjologiczne krzywizny kręgosłupa.","answer":"Lordoza szyjna, kifoza piersiowa, lordoza lędźwiowa, kifoza krzyżowa."},{"id":"F-V-008","kind":"card","lecture":"V","slide":"11","topic":"Postawa i rozwój","difficulty":"basic","priority":false,"question":"Jakie krzywizny nasilają się wraz z pionizacją małego dziecka?","answer":"Kifoza piersiowa i lordoza lędźwiowa."},{"id":"F-V-009","kind":"card","lecture":"V","slide":"13","topic":"Postawa i rozwój","difficulty":"medium","priority":false,"question":"Jakie są dwa okresy zwiększonego ryzyka wad postawy u dzieci szkolnych?","answer":"6–7 lat (początek siedzącego trybu szkolnego) oraz skok pokwitaniowy: dziewczęta 11–13 lat, chłopcy 13–14 lat."},{"id":"F-V-010","kind":"card","lecture":"V","slide":"16","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"question":"Kiedy według wykładu zaczyna powstawać lordoza szyjna?","answer":"W 3.–4. miesiącu życia, wraz z unoszeniem głowy."},{"id":"F-V-011","kind":"card","lecture":"V","slide":"16","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"question":"Kiedy kształtuje się lordoza lędźwiowa u dziecka?","answer":"Około 9.–12. miesiąca życia, w związku z pionizacją."},{"id":"F-V-012","kind":"card","lecture":"V","slide":"16","topic":"Postawa i rozwój","difficulty":"basic","priority":true,"question":"Kiedy następuje względna stabilizacja krzywizn kręgosłupa?","answer":"Około trzeciego roku życia."},{"id":"F-V-013","kind":"card","lecture":"V","slide":"18","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"question":"Jak długo trwa I stadium zgięciowe według Vojty?","answer":"Od urodzenia do około 6. tygodnia życia; przeważa napięcie zginaczy."},{"id":"F-V-014","kind":"card","lecture":"V","slide":"18","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"question":"Jaki okres obejmuje I stadium wyprostne według Vojty?","answer":"7.–16. tydzień życia; pojawia się prostowanie kończyn i unoszenie głowy w podporze."},{"id":"F-V-015","kind":"card","lecture":"V","slide":"19","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"question":"Jakie umiejętności rozwijają się w II stadium zgięciowym Vojty?","answer":"Przygotowanie do lokomocji: siady, obroty i podporowe ustawienie kończyn, około 5.–8. miesiąca."},{"id":"F-V-016","kind":"card","lecture":"V","slide":"19","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"question":"Co wyróżnia II stadium wyprostne Vojty?","answer":"Około 9.–12. miesiąca rozwija się wyprost bioder i stanie najpierw z podparciem."},{"id":"F-V-017","kind":"card","lecture":"V","slide":"24","topic":"Etiologia i diagnostyka","difficulty":"basic","priority":false,"question":"Jakie trzy grupy czynników prowadzących do wad postawy wymienia wykład?","answer":"Czynniki fizjologiczne/nawykowe, morfologiczne oraz środowiskowe."},{"id":"F-V-018","kind":"card","lecture":"V","slide":"26","topic":"Etiologia i diagnostyka","difficulty":"basic","priority":false,"question":"Podaj trzy środowiskowe czynniki sprzyjające wadom postawy.","answer":"Długie siedzenie, mała aktywność ruchowa i nieprawidłowo dopasowane stanowisko nauki/pracy."},{"id":"F-V-019","kind":"card","lecture":"V","slide":"28","topic":"Etiologia i diagnostyka","difficulty":"medium","priority":false,"question":"Jakie elementy ocenia się w oglądaniu postawy od przodu?","answer":"Oś ciała, poziom uszu i barków, symetrię talii i miednicy oraz ustawienie kolan i stóp."},{"id":"F-V-020","kind":"card","lecture":"V","slide":"30","topic":"Etiologia i diagnostyka","difficulty":"medium","priority":false,"question":"Co ocenia się podczas obserwacji postawy z boku?","answer":"Ustawienie głowy, barków, klatki i brzucha, krzywizny kręgosłupa, nachylenie miednicy oraz kolana i stopy."},{"id":"F-V-021","kind":"card","lecture":"V","slide":"32","topic":"Etiologia i diagnostyka","difficulty":"medium","priority":false,"question":"Co obserwuje się w ocenie postawy od tyłu?","answer":"Oś wyrostków kolczystych, poziom barków i łopatek, symetrię talerzy biodrowych, fałdów i pięt."},{"id":"F-V-022","kind":"card","lecture":"V","slide":"34","topic":"Etiologia i diagnostyka","difficulty":"basic","priority":false,"question":"Na czym polega metoda punktowa Kasperczyka?","answer":"Na wzrokowej ocenie elementów postawy i przypisywaniu im punktów za wielkość odchylenia."},{"id":"F-V-023","kind":"card","lecture":"V","slide":"36","topic":"Etiologia i diagnostyka","difficulty":"basic","priority":false,"question":"Co oznacza wyższa suma punktów w metodzie Kasperczyka?","answer":"Większe nieprawidłowości postawy, czyli gorszą ocenę."},{"id":"F-V-024","kind":"card","lecture":"V","slide":"42","topic":"Etiologia i diagnostyka","difficulty":"medium","priority":false,"question":"Jakie trzy rodziny sylwetek wyróżnia metoda Wolańskiego?","answer":"Kifotyczne K, lordotyczne L i równoważne R; każda w trzech odmianach."},{"id":"F-V-025","kind":"card","lecture":"V","slide":"44","topic":"Analiza chodu","difficulty":"basic","priority":false,"question":"Jak w wykładzie zdefiniowano cykl chodu?","answer":"Czas od jednego kontaktu danej pięty z podłożem do kolejnego kontaktu tej samej pięty."},{"id":"F-V-026","kind":"card","lecture":"V","slide":"44","topic":"Analiza chodu","difficulty":"basic","priority":false,"question":"Jaki procent cyklu chodu obejmują fazy podporowa i przenoszenia?","answer":"Podporowa około 60%, przenoszenia około 40%."},{"id":"F-V-027","kind":"card","lecture":"V","slide":"45","topic":"Analiza chodu","difficulty":"medium","priority":false,"question":"Co obejmuje faza podporowa chodu?","answer":"Kontakt początkowy, przyjmowanie ciężaru, środkowy i końcowy podpór oraz okres przed przenoszeniem."},{"id":"F-V-028","kind":"card","lecture":"V","slide":"46","topic":"Analiza chodu","difficulty":"medium","priority":false,"question":"Jakie trzy części obejmuje faza przenoszenia (swing)?","answer":"Initial swing, mid swing i terminal swing, czyli przenoszenie wstępne, środkowe i końcowe."},{"id":"F-V-029","kind":"card","lecture":"V","slide":"51","topic":"Analiza chodu","difficulty":"basic","priority":false,"question":"Czym charakteryzuje się chód antalgiczny?","answer":"Skróceniem obciążania kończyny bolesnej i oszczędzaniem jej podczas podporu."},{"id":"F-V-030","kind":"card","lecture":"V","slide":"52","topic":"Analiza chodu","difficulty":"basic","priority":false,"question":"Czym charakteryzuje się chód brodzący (bociani)?","answer":"Wysokim unoszeniem kolana, aby nie zahaczyć stopą opadającą podczas przenoszenia."},{"id":"F-V-031","kind":"card","lecture":"V","slide":"53","topic":"Analiza chodu","difficulty":"medium","priority":false,"question":"Co oznacza chód kaczkowaty?","answer":"Kołysanie tułowia i miednicy związane m.in. z osłabieniem mięśni obręczy biodrowej."},{"id":"F-V-032","kind":"card","lecture":"V","slide":"55","topic":"Analiza chodu","difficulty":"medium","priority":false,"question":"Czym charakteryzuje się chód koszący?","answer":"Niedowładna kończyna zatacza łuk na zewnątrz podczas przenoszenia, np. przy spastyczności po udarze."},{"id":"F-V-033","kind":"card","lecture":"V","slide":"58","topic":"Analiza chodu","difficulty":"basic","priority":false,"question":"Jak rozpoznać chód ataktyczny?","answer":"Niepewny, chwiejny chód z zaburzoną koordynacją, często na szerokiej podstawie."},{"id":"F-V-034","kind":"card","lecture":"V","slide":"61","topic":"Wady kręgosłupa","difficulty":"basic","priority":true,"question":"Jaka krzywizna jest pogłębiona przy plecach okrągłych?","answer":"Kifoza piersiowa; często współistnieje wysunięcie głowy i barków do przodu."},{"id":"F-V-035","kind":"card","lecture":"V","slide":"63","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"question":"Jakie mięśnie bywają przykurczone przy plecach okrągłych według wykładu?","answer":"Mięśnie piersiowe większe i mniejsze oraz część mięśni przedniej ściany klatki piersiowej."},{"id":"F-V-036","kind":"card","lecture":"V","slide":"65","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"question":"W jakim kierunku prowadzi się korekcję pleców okrągłych?","answer":"Rozciąga się struktury przykurczone z przodu klatki i wzmacnia osłabione mięśnie grzbietu, ucząc prawidłowej postawy."},{"id":"F-V-037","kind":"card","lecture":"V","slide":"66","topic":"Wady kręgosłupa","difficulty":"basic","priority":true,"question":"Co wyróżnia plecy wklęsłe?","answer":"Pogłębiona lordoza lędźwiowa, często przodopochylenie miednicy i uwypuklony brzuch."},{"id":"F-V-038","kind":"card","lecture":"V","slide":"68","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"question":"Które grupy mięśniowe są osłabione przy plecach wklęsłych?","answer":"W wykładzie wymieniono m.in. mięśnie brzucha, pośladkowe i kulszowo-goleniowe."},{"id":"F-V-039","kind":"card","lecture":"V","slide":"68","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"question":"Jakie mięśnie są przykurczone w przypadku pleców wklęsłych?","answer":"M.in. biodrowo-lędźwiowy, prosty uda i prostowniki lędźwiowe."},{"id":"F-V-040","kind":"card","lecture":"V","slide":"71","topic":"Wady kręgosłupa","difficulty":"basic","priority":true,"question":"Czym charakteryzują się plecy okrągło-wklęsłe?","answer":"Jednoczesnym pogłębieniem kifozy piersiowej i lordozy lędźwiowej."},{"id":"F-V-041","kind":"card","lecture":"V","slide":"75","topic":"Wady kręgosłupa","difficulty":"hard","priority":true,"question":"Jaka zasada stabilizacji obowiązuje przy korekcji pleców okrągło-wklęsłych?","answer":"Korygując jedną krzywiznę, stabilizuje się drugi odcinek kręgosłupa, unikając kompensacji i hiperkorekcji."},{"id":"F-V-042","kind":"card","lecture":"V","slide":"76","topic":"Wady kręgosłupa","difficulty":"basic","priority":true,"question":"Czym są plecy płaskie?","answer":"Postawą ze spłyconymi fizjologicznymi krzywiznami kręgosłupa."},{"id":"F-V-043","kind":"card","lecture":"V","slide":"79","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"question":"Jakie funkcjonalne następstwo może mieć spłaszczenie krzywizn kręgosłupa?","answer":"Zmniejszenie amortyzacji i ruchomości kręgosłupa oraz większa podatność na przeciążenia."},{"id":"F-V-044","kind":"card","lecture":"V","slide":"80","topic":"Wady kręgosłupa","difficulty":"hard","priority":true,"question":"Jakich rodzajów ćwiczeń odradza wykład przy plecach płaskich?","answer":"M.in. zwisów, przeprostów, nadmiernej elongacji i niektórych ćwiczeń gibkościowych; jest to zalecenie dla tej wady, nie przeciwwskazanie do pionizacji."},{"id":"F-V-045","kind":"card","lecture":"V","slide":"81","topic":"Skolioza","difficulty":"basic","priority":true,"question":"Dlaczego skolioza jest wadą trójwymiarową?","answer":"Obejmuje boczne skrzywienie kręgosłupa oraz rotację i torsję kręgów."},{"id":"F-V-046","kind":"card","lecture":"V","slide":"85","topic":"Skolioza","difficulty":"medium","priority":true,"question":"Czym różni się rotacja od torsji kręgów?","answer":"Rotacja to obrót kręgu wokół osi długiej, a torsja – utrwalona zmiana jego kształtu podczas skręcenia."},{"id":"F-V-047","kind":"card","lecture":"V","slide":"88","topic":"Skolioza","difficulty":"medium","priority":true,"question":"Jaki zakres kąta Cobba odpowiada postawie skoliotycznej w podziale z wykładu?","answer":"Do 10°."},{"id":"F-V-048","kind":"card","lecture":"V","slide":"88","topic":"Skolioza","difficulty":"medium","priority":true,"question":"Jaki zakres kąta Cobba przypisano skoliozie II stopnia w wykładzie?","answer":"31–60°; podział ten jest klasyfikacją przedstawioną na slajdzie."},{"id":"F-V-049","kind":"card","lecture":"V","slide":"89","topic":"Skolioza","difficulty":"medium","priority":true,"question":"Jak wyznacza się kąt Cobba na zdjęciu RTG?","answer":"Z linii granicznych wybranych kręgów krańcowych i kąta między prostopadłymi do tych linii."},{"id":"F-V-050","kind":"card","lecture":"V","slide":"92","topic":"Skolioza","difficulty":"medium","priority":true,"question":"Czym wyróżnia się skolioza czynnościowa?","answer":"Odwracalnym, nieutrwalonym skrzywieniem bez zmian strukturalnych i trwałej torsji."},{"id":"F-V-051","kind":"card","lecture":"V","slide":"93","topic":"Skolioza","difficulty":"medium","priority":true,"question":"Czym charakteryzuje się skolioza strukturalna?","answer":"Utrwalonymi zmianami kręgów i tułowia z rotacją oraz torsją."},{"id":"F-V-052","kind":"card","lecture":"V","slide":"90","topic":"Skolioza","difficulty":"basic","priority":true,"question":"Jak dzieli się skoliozy według liczby łuków?","answer":"Na jednołukowe, dwułukowe i wielołukowe."},{"id":"F-V-053","kind":"card","lecture":"V","slide":"98","topic":"Skolioza","difficulty":"basic","priority":true,"question":"Wymień dwa możliwe następstwa zaawansowanej skoliozy.","answer":"Ból i asymetria tułowia; w dużych deformacjach także zaburzenia oddychania i wydolności krążeniowej."},{"id":"F-V-054","kind":"card","lecture":"V","slide":"100","topic":"Skolioza","difficulty":"medium","priority":true,"question":"Kiedy według wykładu rozważa się gorset w postępującej skoliozie?","answer":"Przy progresji skrzywienia i kącie Cobba powyżej około 25° u osoby z niedojrzałym szkieletem."},{"id":"F-V-055","kind":"card","lecture":"V","slide":"101","topic":"Skolioza","difficulty":"hard","priority":true,"question":"Jakie są końcowe dwa elementy sześciostopniowej korekcji skoliozy?","answer":"Wzmocnienie osłabionych mięśni i utrwalenie nawyku prawidłowej postawy."},{"id":"F-V-056","kind":"card","lecture":"V","slide":"103","topic":"Skolioza","difficulty":"basic","priority":true,"question":"Co oznaczają litery FED w metodzie korekcji skoliozy?","answer":"Fiksacja, elongacja, derotacja."},{"id":"F-V-057","kind":"card","lecture":"V","slide":"105","topic":"Skolioza","difficulty":"hard","priority":true,"question":"Jakie trzy części zabiegu FED podaje prezentacja?","answer":"Przygotowanie fizykoterapeutyczne, praca w urządzeniu FED oraz indywidualne ćwiczenia."},{"id":"F-V-058","kind":"card","lecture":"V","slide":"108","topic":"Wady klatki piersiowej","difficulty":"basic","priority":true,"question":"Jaka jest główna cecha klatki piersiowej lejkowatej?","answer":"Zapadnięcie mostka i przyległych żeber do wnętrza klatki piersiowej."},{"id":"F-V-059","kind":"card","lecture":"V","slide":"113","topic":"Wady klatki piersiowej","difficulty":"medium","priority":true,"question":"Jakie ćwiczenia wymienia wykład przy klatce piersiowej lejkowatej?","answer":"Rozciąganie mięśni piersiowych, wzmacnianie mięśni grzbietu, poprawa ruchomości klatki i ćwiczenia oddechowe."},{"id":"F-V-060","kind":"card","lecture":"V","slide":"114","topic":"Wady klatki piersiowej","difficulty":"basic","priority":true,"question":"Czym różni się klatka piersiowa kurza od lejkowatej?","answer":"W kurzej mostek uwypukla się do przodu; w lejkowatej jest zapadnięty."},{"id":"F-V-061","kind":"card","lecture":"V","slide":"119","topic":"Wady kolan i stóp","difficulty":"basic","priority":true,"question":"Jak rozpoznać koślawość kolan?","answer":"Kolana zbliżają się do siebie, natomiast kostki przyśrodkowe są od siebie oddalone."},{"id":"F-V-062","kind":"card","lecture":"V","slide":"119","topic":"Wady kolan i stóp","difficulty":"medium","priority":true,"question":"Jaką granicę koślawości kolan wykład określa jako patologiczną?","answer":"Powyżej 10°; podano także dystans między kostkami powyżej 5 cm jako cechę wady."},{"id":"F-V-063","kind":"card","lecture":"V","slide":"124","topic":"Wady kolan i stóp","difficulty":"basic","priority":true,"question":"Jak rozpoznać szpotawość kolan?","answer":"Kolana są od siebie oddalone, a kończyny dolne ustawiają się łukowato."},{"id":"F-V-064","kind":"card","lecture":"V","slide":"126","topic":"Wady kolan i stóp","difficulty":"medium","priority":true,"question":"Jakiego siadu wykład odradza przy szpotawości kolan?","answer":"Siadu skrzyżnego; wymienia także stanie ze skrzyżowanymi nogami."},{"id":"F-V-065","kind":"card","lecture":"V","slide":"128","topic":"Wady kolan i stóp","difficulty":"basic","priority":true,"question":"Czym charakteryzuje się stopa płaska?","answer":"Obniżonymi lub niewidocznymi łukami podłużnym i poprzecznym stopy."},{"id":"F-V-066","kind":"card","lecture":"V","slide":"131","topic":"Wady kolan i stóp","difficulty":"medium","priority":true,"question":"Wymień główne elementy stopy końsko-szpotawej.","answer":"Ustawienie końskie, szpotawość pięty, przywiedzenie przodostopia i wysokie wysklepienie."},{"id":"F-V-067","kind":"card","lecture":"V","slide":"135","topic":"Wady kolan i stóp","difficulty":"basic","priority":true,"question":"Co wyróżnia stopę koślawą?","answer":"Odchylenie pięty na zewnątrz z obniżeniem łuku podłużnego."},{"id":"F-VI-001","kind":"card","lecture":"VI","slide":"2","topic":"Oddychanie i wentylacja","difficulty":"basic","priority":false,"question":"Co jest głównym mięśniem wdechowym?","answer":"Przepona."},{"id":"F-VI-002","kind":"card","lecture":"VI","slide":"2","topic":"Oddychanie i wentylacja","difficulty":"basic","priority":false,"question":"Czy wdech w spoczynku jest czynny czy bierny?","answer":"Czynny – wynika m.in. ze skurczu przepony i mięśni międzyżebrowych zewnętrznych."},{"id":"F-VI-003","kind":"card","lecture":"VI","slide":"3","topic":"Oddychanie i wentylacja","difficulty":"basic","priority":false,"question":"Jaki charakter ma spokojny wydech?","answer":"Bierny, związany z rozkurczem mięśni wdechowych i sprężystym powrotem układu oddechowego."},{"id":"F-VI-004","kind":"card","lecture":"VI","slide":"3","topic":"Oddychanie i wentylacja","difficulty":"basic","priority":false,"question":"Jaką relację czasu wydechu do wdechu podaje wykład?","answer":"Wydech jest około dwukrotnie dłuższy od wdechu."},{"id":"F-VI-005","kind":"card","lecture":"VI","slide":"9","topic":"Oddychanie i wentylacja","difficulty":"basic","priority":false,"question":"Jakie trzy podstawowe tory oddechu omawia wykład?","answer":"Górnożebrowy, dolnożebrowy i przeponowy; dodatkowo tor mieszany."},{"id":"F-VI-006","kind":"card","lecture":"VI","slide":"9","topic":"Oddychanie i wentylacja","difficulty":"medium","priority":false,"question":"Jak rozpoznać oddychanie górnożebrowe?","answer":"Unosi się górna część klatki piersiowej, mostek i obojczyki."},{"id":"F-VI-007","kind":"card","lecture":"VI","slide":"9","topic":"Oddychanie i wentylacja","difficulty":"medium","priority":false,"question":"Jak rozpoznać oddychanie dolnożebrowe?","answer":"Dolne żebra rozszerzają się na boki i ku górze."},{"id":"F-VI-008","kind":"card","lecture":"VI","slide":"9","topic":"Oddychanie i wentylacja","difficulty":"basic","priority":false,"question":"Co porusza się podczas wdechu torem przeponowym?","answer":"Przepona obniża się, a ściana brzucha uwypukla do przodu."},{"id":"F-VI-009","kind":"card","lecture":"VI","slide":"15","topic":"Oddychanie i wentylacja","difficulty":"medium","priority":false,"question":"Która pozycja według wykładu ułatwia spokojny oddech i odkrztuszanie?","answer":"Pozycja półsiedząca."},{"id":"F-VI-010","kind":"card","lecture":"VI","slide":"20","topic":"Techniki oddechowe","difficulty":"basic","priority":true,"question":"Od jakiej fazy oddechu rozpoczyna się ćwiczenie oddechowe według wykładu?","answer":"Od wydechu."},{"id":"F-VI-011","kind":"card","lecture":"VI","slide":"20","topic":"Techniki oddechowe","difficulty":"basic","priority":true,"question":"Jaką drogą należy wykonywać wdech i wydech w podstawowym ćwiczeniu?","answer":"Wdech nosem, wydech ustami."},{"id":"F-VI-012","kind":"card","lecture":"VI","slide":"20","topic":"Techniki oddechowe","difficulty":"medium","priority":true,"question":"Ile powtórzeń w serii zaleca podstawowy instruktaż oddechowy w wykładzie?","answer":"3–4, z przerwami, aby nie powodować hiperwentylacji."},{"id":"F-VI-013","kind":"card","lecture":"VI","slide":"22","topic":"Techniki oddechowe","difficulty":"medium","priority":true,"question":"Czym różnią się ćwiczenia oddechowe statyczne od dynamicznych?","answer":"Statyczne nie wymagają ruchu kończyn; dynamiczne łączą oddech z ruchami kończyn lub tułowia."},{"id":"F-VI-014","kind":"card","lecture":"VI","slide":"24","topic":"Techniki oddechowe","difficulty":"medium","priority":true,"question":"W jaki sposób można zwiększyć opór oddechu?","answer":"Ręką terapeuty, ułożeniem ciała, woreczkiem z obciążeniem albo wydechem przez rurkę do wody."},{"id":"F-VI-015","kind":"card","lecture":"VI","slide":"25","topic":"Oczyszczanie dróg oddechowych","difficulty":"basic","priority":true,"question":"Jaki jest cel drenażu ułożeniowego?","answer":"Ułatwienie przemieszczania wydzieliny z oskrzeli przez wykorzystanie grawitacji."},{"id":"F-VI-016","kind":"card","lecture":"VI","slide":"28","topic":"Oczyszczanie dróg oddechowych","difficulty":"medium","priority":true,"question":"Czym różni się drenaż dynamiczny od statycznego?","answer":"W dynamicznym pacjent kontrolowanie pochyla tułów w różnych kierunkach; statyczny opiera się na utrzymaniu pozycji."},{"id":"F-VI-017","kind":"card","lecture":"VI","slide":"30","topic":"Oczyszczanie dróg oddechowych","difficulty":"medium","priority":true,"question":"Wymień dwa przeciwwskazania do drenażu ułożeniowego z prezentacji.","answer":"Na przykład świeży zawał, niewydolność krążenia, krwawienie, świeży udar lub nietolerancja pozycji odwróconej."},{"id":"F-VI-018","kind":"card","lecture":"VI","slide":"34","topic":"Oczyszczanie dróg oddechowych","difficulty":"medium","priority":true,"question":"Ile może trwać pojedyncza seria oklepywania według slajdu 34?","answer":"Nie dłużej niż 3–4 min na raz, w 2–3 seriach."},{"id":"F-VI-019","kind":"card","lecture":"VI","slide":"34","topic":"Oczyszczanie dróg oddechowych","difficulty":"basic","priority":true,"question":"Jakich miejsc nie należy oklepywać podczas drenażu klatki?","answer":"Kręgosłupa oraz okolicy nerek."},{"id":"F-VI-020","kind":"card","lecture":"VI","slide":"36","topic":"Oczyszczanie dróg oddechowych","difficulty":"medium","priority":true,"question":"Wymień dwa przeciwwskazania do oklepywania.","answer":"Np. złamanie żeber, zaawansowana osteoporoza, krwawienie, niezdrenowana odma opłucnowa."},{"id":"F-VI-021","kind":"card","lecture":"VI","slide":"37","topic":"Efektywny kaszel","difficulty":"basic","priority":true,"question":"Wymień dwa rodzaje kaszlu omawiane w wykładzie.","answer":"Kaszel podwójny, kontrolowany lub wzmocniony."},{"id":"F-VI-022","kind":"card","lecture":"VI","slide":"38","topic":"Efektywny kaszel","difficulty":"hard","priority":true,"question":"U jakiego pacjenta może być potrzebne wspomaganie kaszlu przez terapeutę?","answer":"U pacjenta z osłabionymi mięśniami oddechowymi, np. neurologicznego, z płytkim i mało efektywnym kaszlem."},{"id":"F-VI-023","kind":"card","lecture":"VI","slide":"39","topic":"Efektywny kaszel","difficulty":"medium","priority":true,"question":"Na czym polega technika FET (huff)?","answer":"Wdech nosem i natężony wydech przez otwarte usta z głoską „h”, aby przesuwać wydzielinę."},{"id":"F-VI-024","kind":"card","lecture":"VI","slide":"39","topic":"Efektywny kaszel","difficulty":"medium","priority":true,"question":"Przy jakiej reaktywności kaszlu wykład odradza FET?","answer":"Przy nadreaktywności kaszlu, gdy forsowny wydech jest źle tolerowany."},{"id":"F-VI-025","kind":"card","lecture":"VI","slide":"43","topic":"Oczyszczanie dróg oddechowych","difficulty":"hard","priority":true,"question":"Wymień trzy elementy aktywnego cyklu oddechowego (ACBT).","answer":"Kontrola oddechu przeponowego, ćwiczenia ekspansji klatki piersiowej, technika natężonego wydechu FET."},{"id":"F-VI-026","kind":"card","lecture":"VI","slide":"44","topic":"Oczyszczanie dróg oddechowych","difficulty":"hard","priority":true,"question":"Jakie są trzy fazy drenażu autogennego?","answer":"Rozluźnienie wydzieliny w małych oskrzelach, transport do większych oskrzeli, przemieszczenie do gardła i odkrztuszenie."},{"id":"F-VI-027","kind":"card","lecture":"VI","slide":"50","topic":"Oczyszczanie dróg oddechowych","difficulty":"hard","priority":true,"question":"Wymień cztery etapy usuwania wydzieliny z dróg oddechowych.","answer":"Rozrzedzenie śluzu, oderwanie od ściany oskrzela, przesunięcie do dużych dróg oddechowych, wykrztuszenie."},{"id":"F-VI-028","kind":"card","lecture":"VI","slide":"53","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Na czym polega zaburzenie restrykcyjne oddychania?","answer":"Na ograniczeniu rozprężania płuc/klatki piersiowej i zmniejszeniu możliwej objętości wdechowej."},{"id":"F-VI-029","kind":"card","lecture":"VI","slide":"55","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Na czym polega zaburzenie obturacyjne oddychania?","answer":"Na zwiększonym oporze przepływu przez zwężone drogi oddechowe, zwłaszcza podczas wydechu."},{"id":"F-VI-030","kind":"card","lecture":"VI","slide":"61","topic":"Choroby płuc","difficulty":"basic","priority":false,"question":"Jaką chorobą jest astma oskrzelowa według wykładu?","answer":"Przewlekłym zapaleniem oskrzeli z nadreaktywnością i zwykle odwracalną obturacją."},{"id":"F-VI-031","kind":"card","lecture":"VI","slide":"62","topic":"Choroby płuc","difficulty":"basic","priority":false,"question":"Wymień trzy typowe objawy astmy.","answer":"Świsty, napadowa duszność i kaszel, często z wydłużonym wydechem."},{"id":"F-VI-032","kind":"card","lecture":"VI","slide":"64","topic":"Choroby płuc","difficulty":"medium","priority":true,"question":"Co oznacza wydech przez zasznurowane usta?","answer":"Spokojny, wydłużony wydech przez zwężone wargi, bez nadmiernego parcia."},{"id":"F-VI-033","kind":"card","lecture":"VI","slide":"65","topic":"Choroby płuc","difficulty":"medium","priority":true,"question":"Jak wygląda pozycja woźnicy?","answer":"Siad z tułowiem lekko pochylonym do przodu oraz przedramionami podpartymi na udach lub podporze."},{"id":"F-VI-034","kind":"card","lecture":"VI","slide":"70","topic":"Choroby płuc","difficulty":"basic","priority":false,"question":"Czym są rozstrzenie oskrzeli?","answer":"Trwałym rozszerzeniem oskrzeli, zwykle ze stanem zapalnym i utrudnionym oczyszczaniem wydzieliny."},{"id":"F-VI-035","kind":"card","lecture":"VI","slide":"72","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Jaki kaszel jest typowy dla rozstrzeni oskrzeli?","answer":"Przewlekły kaszel wilgotny z obfitą plwociną, niekiedy cuchnącą."},{"id":"F-VI-036","kind":"card","lecture":"VI","slide":"78","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Jakie trzy typy rozedmy wyróżnia wykład?","answer":"Rozedma centralnej części płacika, całego płacika i przegrodowa."},{"id":"F-VI-037","kind":"card","lecture":"VI","slide":"80","topic":"Choroby płuc","difficulty":"basic","priority":false,"question":"Wymień dwie charakterystyczne cechy rozedmy płuc.","answer":"Postępująca duszność i beczkowata klatka piersiowa; mogą występować świsty i szybka męczliwość."},{"id":"F-VI-038","kind":"card","lecture":"VI","slide":"84","topic":"Choroby płuc","difficulty":"medium","priority":true,"question":"Dlaczego w rozedmie uczy się wydechu przez zwężone usta?","answer":"Niewielki opór wydechowy pomaga utrzymać drożność małych dróg oddechowych."},{"id":"F-VI-039","kind":"card","lecture":"VI","slide":"85","topic":"Choroby płuc","difficulty":"medium","priority":true,"question":"Czego wykład nie zaleca przy wydechu osoby z rozedmą?","answer":"Silnego parcia i nadmuchiwania balonika, ponieważ zwiększają ciśnienie wydechowe."},{"id":"F-VI-040","kind":"card","lecture":"VI","slide":"88","topic":"Choroby płuc","difficulty":"basic","priority":false,"question":"Co oznacza skrót POChP?","answer":"Przewlekła obturacyjna choroba płuc."},{"id":"F-VI-041","kind":"card","lecture":"VI","slide":"89","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Jakie stadia POChP przedstawia historyczny podział z wykładu?","answer":"0 – zagrożenie, I – lekkie, II – umiarkowane, III – ciężkie, IV – bardzo ciężkie."},{"id":"F-VI-042","kind":"card","lecture":"VI","slide":"92","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Czym charakteryzuje się wykładowy typ POChP „różowy sapacz”?","answer":"Nasiloną dusznością, wychudzeniem i rozdęciem płuc bez wyraźnej sinicy."},{"id":"F-VI-043","kind":"card","lecture":"VI","slide":"92","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Czym charakteryzuje się wykładowy typ POChP „niebieski dmuchacz”?","answer":"Sinicą, obfitą wydzieliną i nierzadko obrzękami oraz nadwagą."},{"id":"F-VI-044","kind":"card","lecture":"VI","slide":"95","topic":"Choroby płuc","difficulty":"basic","priority":false,"question":"Co obejmuje zapalenie płuc?","answer":"Stan zapalny miąższu płuca, w tym pęcherzyków płucnych."},{"id":"F-VI-045","kind":"card","lecture":"VI","slide":"97","topic":"Choroby płuc","difficulty":"basic","priority":false,"question":"Czym jest wysiękowe zapalenie opłucnej?","answer":"Stanem z gromadzeniem płynu w jamie opłucnej, który ogranicza rozprężanie płuca."},{"id":"F-VI-046","kind":"card","lecture":"VI","slide":"101","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Co zaleca wykład przy gorączce i utrzymującym się wysięku opłucnowym?","answer":"Pozostawanie w łóżku do ustąpienia ostrej fazy, według opisanego schematu wykładowego."},{"id":"F-VI-047","kind":"card","lecture":"VI","slide":"114","topic":"Choroby płuc","difficulty":"hard","priority":true,"question":"Czy przeciwwskazania ze slajdu 114 są tożsame z przeciwwskazaniami do każdej pionizacji?","answer":"Nie. Slajd 114 dotyczy usprawniania w określonym kontekście onkologicznym i nie stanowi osobnej pełnej listy przeciwwskazań do pionizacji."},{"id":"F-VI-048","kind":"card","lecture":"VI","slide":"119","topic":"Efektywny kaszel","difficulty":"basic","priority":true,"question":"W jakiej pozycji wykład proponuje naukę efektywnego kaszlu po zabiegu?","answer":"W pozycji woźnicy, jeśli pacjent ją toleruje."},{"id":"F-VI-049","kind":"card","lecture":"VI","slide":"119","topic":"Efektywny kaszel","difficulty":"medium","priority":true,"question":"Kiedy w schemacie pooperacyjnym prowokuje się kaszel?","answer":"Na szczycie wydechu, po ćwiczeniach oddechowych torem przeponowym."},{"id":"F-VI-050","kind":"card","lecture":"VI","slide":"119","topic":"Efektywny kaszel","difficulty":"medium","priority":true,"question":"Ile kaszlnięć i serii podaje slajd dotyczący kaszlu pooperacyjnego?","answer":"3–4 kaszlnięcia pod rząd w 2–3 seriach."},{"id":"F-VI-051","kind":"card","lecture":"VI","slide":"122","topic":"Torakochirurgia i pionizacja","difficulty":"medium","priority":true,"question":"Kiedy według wykładu najlepiej rozpocząć przygotowanie przedoperacyjne?","answer":"Około 1–2 tygodni przed planowaną operacją, jeśli jest to możliwe."},{"id":"F-VI-052","kind":"card","lecture":"VI","slide":"122","topic":"Torakochirurgia i pionizacja","difficulty":"medium","priority":true,"question":"Jakie dwie umiejętności należy przećwiczyć przed operacją z myślą o okresie pooperacyjnym?","answer":"Efektywne odkrztuszanie oraz stabilizowanie rany pooperacyjnej podczas kaszlu."},{"id":"F-VI-053","kind":"card","lecture":"VI","slide":"122-125","topic":"Rana, blizna i odleżyny","difficulty":"medium","priority":true,"question":"Jakie sposoby stabilizacji okolicy operowanej omawia wykład?","answer":"Autostabilizację własnymi rękami, podparcie rękami terapeuty oraz pas lub szelki stabilizujące klatkę."},{"id":"F-VI-054","kind":"card","lecture":"VI","slide":"130","topic":"Rana, blizna i odleżyny","difficulty":"medium","priority":true,"question":"Po co prowadzi się stopniowe rozciąganie blizny w rehabilitacji pooperacyjnej?","answer":"Aby przeciwdziałać ograniczeniom ruchomości i przykurczom tkanek, zgodnie z celami wykładu."},{"id":"F-VI-055","kind":"card","lecture":"VI","slide":"130","topic":"Rana, blizna i odleżyny","difficulty":"medium","priority":true,"question":"Czy slajdy podają szczegółowy schemat oceny odleżyn i blizn?","answer":"Nie. Wspominają o profilaktyce odleżyn i problemach z blizną, ale bez pełnej klasyfikacji i badania."},{"id":"F-VI-056","kind":"card","lecture":"VI","slide":"131","topic":"Torakochirurgia i pionizacja","difficulty":"hard","priority":true,"question":"Co obejmuje usprawnianie w dobie zerowej po torakochirurgii?","answer":"Półsiad, ćwiczenia przeponowe i statyczne z oporem, kaszel ze stabilizacją rany, oklepywanie po stronie nieoperowanej, ruchy bierne lub czynno-bierne."},{"id":"F-VI-057","kind":"card","lecture":"VI","slide":"131","topic":"Torakochirurgia i pionizacja","difficulty":"medium","priority":true,"question":"Co włącza się do rehabilitacji w dobach 1–3?","answer":"Ćwiczenia czynne kończyn od części dystalnych, samowspomagane ćwiczenia barku, ćwiczenia izometryczne i stopniową pionizację."},{"id":"F-VI-058","kind":"card","lecture":"VI","slide":"132","topic":"Torakochirurgia i pionizacja","difficulty":"hard","priority":true,"question":"Wymień kolejność pionizacji pacjenta po zabiegu według slajdu 132.","answer":"Siad płaski w łóżku, siad z nogami spuszczonymi, stanie przy łóżku, pełna pionizacja z asekuracją terapeuty."},{"id":"F-VI-059","kind":"card","lecture":"VI","slide":"132","topic":"Bezpieczeństwo ćwiczeń","difficulty":"hard","priority":true,"question":"Jakie objawy podczas pionizacji nakazują natychmiast przerwać ćwiczenia?","answer":"Oznaki niedotlenienia: zasinienie warg, końców palców i paznokci oraz krople potu na czole."},{"id":"F-VI-060","kind":"card","lecture":"VI","slide":"132","topic":"Torakochirurgia i pionizacja","difficulty":"medium","priority":true,"question":"Co obejmuje rehabilitacja w dobach 4–6?","answer":"Bardziej intensywne ćwiczenia, siad/stanie, zwiększanie ruchomości barku, pionizację i spacery z asekuracją."},{"id":"F-VI-061","kind":"card","lecture":"VI","slide":"133","topic":"Torakochirurgia i pionizacja","difficulty":"medium","priority":true,"question":"Jakie pomiary zaleca wykład podczas treningu po 6. dobie?","answer":"Tętno, ciśnienie krwi oraz liczbę oddechów przed, w trakcie i po ćwiczeniach."},{"id":"F-VI-062","kind":"card","lecture":"VI","slide":"133","topic":"Torakochirurgia i pionizacja","difficulty":"hard","priority":true,"question":"Jakie ćwiczenia slajd dopuszcza w dobie usunięcia drenu?","answer":"Ćwiczenia oddechowe torem przeponowym i ćwiczenia przeciwzakrzepowe."},{"id":"F-VI-063","kind":"card","lecture":"VI","slide":"133","topic":"Bezpieczeństwo ćwiczeń","difficulty":"medium","priority":true,"question":"Jakie ograniczenia do ćwiczeń pooperacyjnych wymienia slajd 133?","answer":"Podwyższoną temperaturę ciała oraz ogólny lub miejscowy stan zapalny; slajd robi wyjątek dla ćwiczeń oddechowych i skutecznego kaszlu."},{"id":"F-VI-064","kind":"card","lecture":"VI","slide":"33","topic":"Rana, blizna i odleżyny","difficulty":"medium","priority":true,"question":"Czy slajd opisuje mobilizację tkanek na świeżej niezagojonej ranie?","answer":"Nie. Wskazuje działania na okolicy po zagojeniu rany, nie pełny protokół manualny."},{"id":"F-VI-065","kind":"card","lecture":"VI","slide":"148","topic":"Mukowiscydoza","difficulty":"medium","priority":true,"question":"Co oznacza FET w fizjoterapii mukowiscydozy?","answer":"Technika natężonego, forsownego wydechu (huff)."},{"id":"F-VI-066","kind":"card","lecture":"VI","slide":"149","topic":"Mukowiscydoza","difficulty":"medium","priority":true,"question":"Jaką wartość oporu/ciśnienia PEP wymienia wykład?","answer":"Około 10–20 cm H₂O podczas wydechu przez maskę PEP."},{"id":"F-VI-067","kind":"card","lecture":"VI","slide":"151","topic":"Mukowiscydoza","difficulty":"medium","priority":true,"question":"Jak działa Flutter w oczyszczaniu dróg oddechowych?","answer":"Wydech przez ustnik generuje drgania i dodatnie ciśnienie, co ułatwia mobilizację wydzieliny."},{"id":"F-VI-068","kind":"card","lecture":"VI","slide":"152-153","topic":"Mukowiscydoza","difficulty":"hard","priority":true,"question":"Jak zmienia się objętość oddechowa w fazach drenażu autogennego?","answer":"Od małej przez średnią do dużej, wraz z przemieszczaniem wydzieliny ku większym drogom oddechowym."},{"id":"F-VI-069","kind":"card","lecture":"VI","slide":"154","topic":"Mukowiscydoza","difficulty":"medium","priority":true,"question":"Jak działa kamizelka do oscylacyjnego ucisku klatki?","answer":"Wytwarza rytmiczne drgania/uciski klatki, ułatwiające przemieszczanie wydzieliny."}],"quizzes":[{"id":"Q-V-001","kind":"quiz","lecture":"V","slide":"6","topic":"Postawa i rozwój","difficulty":"basic","priority":false,"qtype":"single","question":"Która postawa najlepiej odzwierciedla naturalne ułożenie ciała?","options":["Nawykowa","Baczna","Defensywna","Wymuszona"],"correct":0,"why":"Slajd 6 odróżnia naturalną postawę nawykową od świadomie korygowanej bacznej."},{"id":"Q-V-002","kind":"quiz","lecture":"V","slide":"10","topic":"Postawa i rozwój","difficulty":"basic","priority":true,"qtype":"single","question":"Która para krzywizn jest zgodna z fizjologią?","options":["Szyjna kifoza, piersiowa lordoza","Szyjna lordoza, piersiowa kifoza","Lędźwiowa kifoza, krzyżowa lordoza","Wszystkie odcinki są proste"],"correct":1,"why":"Szyjna i lędźwiowa to lordozy, piersiowa i krzyżowa to kifozy."},{"id":"Q-V-003","kind":"quiz","lecture":"V","slide":"13","topic":"Postawa i rozwój","difficulty":"medium","priority":false,"qtype":"multi","question":"Które okresy wykład wskazuje jako krytyczne dla wad postawy u dzieci?","options":["6–7 lat","11–13 lat u dziewcząt","13–14 lat u chłopców","22–25 lat"],"correct":[0,1,2],"why":"Ryzyko rośnie wraz ze zmianą trybu życia i skokiem pokwitaniowym."},{"id":"Q-V-004","kind":"quiz","lecture":"V","slide":"16","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"qtype":"order","question":"Ułóż zdarzenia rozwoju krzywizn w chronologicznym porządku.","options":["Dominacja kifozy w życiu płodowym","Rozwój lordozy szyjnej w 3.–4. miesiącu","Rozwój lordozy lędźwiowej w 9.–12. miesiącu","Względna stabilizacja w 3. roku życia"],"correct":[0,1,2,3],"why":"Chronologia rozwoju krzywizn została podana na slajdzie 16."},{"id":"Q-V-005","kind":"quiz","lecture":"V","slide":"18","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"qtype":"single","question":"Co dominuje w pierwszym stadium zgięciowym Vojty?","options":["Prostowniki biodra","Zginacze","Ruchy biegowe","Kontrola stania"],"correct":1,"why":"Wykład opisuje przewagę napięcia zginaczy w pierwszych sześciu tygodniach."},{"id":"Q-V-006","kind":"quiz","lecture":"V","slide":"18","topic":"Postawa i rozwój","difficulty":"hard","priority":true,"qtype":"order","question":"Ułóż stadia rozwojowe według Vojty.","options":["I zgięciowe","I wyprostne","II zgięciowe","II wyprostne"],"correct":[0,1,2,3],"why":"Dwa stadia zgięciowe przeplatają się z dwoma wyprostnymi."},{"id":"Q-V-007","kind":"quiz","lecture":"V","slide":"24","topic":"Etiologia i diagnostyka","difficulty":"medium","priority":false,"qtype":"multi","question":"Jakie grupy czynników etiologicznych wad postawy wymienia wykład?","options":["Fizjologiczne/nawykowe","Morfologiczne","Środowiskowe","Astronomiczne"],"correct":[0,1,2],"why":"Podział na trzy główne grupy występuje na slajdach 24–26."},{"id":"Q-V-008","kind":"quiz","lecture":"V","slide":"28","topic":"Etiologia i diagnostyka","difficulty":"medium","priority":false,"qtype":"single","question":"Który punkt anatomiczny powinien przecinać pion w ocenie sylwetki od przodu?","options":["Środek brody","Wyrostek sutkowaty kości skroniowej","Krętarz większy","Głowa strzałki"],"correct":0,"why":"Slajd 28 wymienia środek brody, wcięcie jarzmowe mostka i spojenie łonowe jako punkty linii pionu od przodu."},{"id":"Q-V-009","kind":"quiz","lecture":"V","slide":"34","topic":"Etiologia i diagnostyka","difficulty":"basic","priority":false,"qtype":"tf","question":"W metodzie Kasperczyka większa liczba punktów oznacza korzystniejszą postawę.","options":[],"correct":false,"why":"Wyższa punktacja odzwierciedla większe odchylenie postawy."},{"id":"Q-V-010","kind":"quiz","lecture":"V","slide":"42","topic":"Etiologia i diagnostyka","difficulty":"medium","priority":false,"qtype":"single","question":"Jaki oznacznik odpowiada sylwetce równoważnej według Wolańskiego?","options":["K","L","R","S"],"correct":2,"why":"W metodzie sylwetkowej K oznacza kifotyczną, L lordotyczną, R równoważną."},{"id":"Q-V-011","kind":"quiz","lecture":"V","slide":"44","topic":"Analiza chodu","difficulty":"basic","priority":false,"qtype":"single","question":"Ile procent cyklu chodu trwa w przybliżeniu faza podporowa?","options":["20%","40%","60%","80%"],"correct":2,"why":"Wykład: 60% podpór i 40% przenoszenie."},{"id":"Q-V-012","kind":"quiz","lecture":"V","slide":"45","topic":"Analiza chodu","difficulty":"medium","priority":false,"qtype":"order","question":"Ułóż pierwsze etapy fazy podporowej w cyklu chodu.","options":["Initial contact","Loading response","Mid stance","Terminal stance"],"correct":[0,1,2,3],"why":"Porządek kolejnych faz podporu zgodny z analizą chodu."},{"id":"Q-V-013","kind":"quiz","lecture":"V","slide":"52","topic":"Analiza chodu","difficulty":"medium","priority":false,"qtype":"single","question":"Który wzorzec chodu wiąże się z opadaniem stopy i wysokim unoszeniem kolana?","options":["Brodzący","Parkinsonowski","Ataktyczny","Kaczkowaty"],"correct":0,"why":"Wysokie unoszenie kolana kompensuje opadającą stopę."},{"id":"Q-V-014","kind":"quiz","lecture":"V","slide":"55","topic":"Analiza chodu","difficulty":"medium","priority":false,"qtype":"single","question":"W którym typie chodu noga wykonuje łuk na zewnątrz podczas przenoszenia?","options":["Koszący","Brodzący","Antalgiczny","Kłaniający"],"correct":0,"why":"Chód koszący jest typowym obrazem jednostronnego spastycznego niedowładu."},{"id":"Q-V-015","kind":"quiz","lecture":"V","slide":"61","topic":"Wady kręgosłupa","difficulty":"basic","priority":true,"qtype":"single","question":"Najważniejszy wyróżnik pleców okrągłych to:","options":["Pogłębiona lordoza lędźwiowa","Pogłębiona kifoza piersiowa","Spłycenie wszystkich krzywizn","Boczna rotacja miednicy"],"correct":1,"why":"Slajd 61 opisuje zwiększoną kifozę piersiową."},{"id":"Q-V-016","kind":"quiz","lecture":"V","slide":"66","topic":"Wady kręgosłupa","difficulty":"basic","priority":true,"qtype":"single","question":"Czym najłatwiej odróżnić plecy wklęsłe?","options":["Pogłębieniem lordozy lędźwiowej","Spłyceniem lordozy szyjnej","Zapadnięciem mostka","Szpotawością kolan"],"correct":0,"why":"Slajd 66 opisuje pogłębioną lordozę lędźwiową."},{"id":"Q-V-017","kind":"quiz","lecture":"V","slide":"71","topic":"Wady kręgosłupa","difficulty":"basic","priority":true,"qtype":"tf","question":"Plecy okrągło-wklęsłe łączą nadmierną kifozę piersiową i lordozę lędźwiową.","options":[],"correct":true,"why":"To połączenie cech pleców okrągłych i wklęsłych."},{"id":"Q-V-018","kind":"quiz","lecture":"V","slide":"75","topic":"Wady kręgosłupa","difficulty":"hard","priority":true,"qtype":"single","question":"Co jest najważniejsze podczas korekcji jednej krzywizny w plecach okrągło-wklęsłych?","options":["Brak stabilizacji innych odcinków","Stabilizacja sąsiedniego odcinka i unikanie kompensacji","Zawsze maksymalny przeprost","Ćwiczenie wyłącznie na stojąco"],"correct":1,"why":"Wykład zaleca stabilizację odcinkową i unikanie hiperkorekcji."},{"id":"Q-V-019","kind":"quiz","lecture":"V","slide":"76","topic":"Wady kręgosłupa","difficulty":"basic","priority":true,"qtype":"single","question":"Spłycenie fizjologicznych krzywizn kręgosłupa to:","options":["Plecy okrągłe","Plecy płaskie","Plecy wklęsłe","Klatka kurza"],"correct":1,"why":"Plecy płaskie charakteryzują się zmniejszeniem krzywizn."},{"id":"Q-V-020","kind":"quiz","lecture":"V","slide":"80","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"qtype":"tf","question":"Wykład zaleca zwisy i nadmierną elongację jako podstawową metodę przy plecach płaskich.","options":[],"correct":false,"why":"Na slajdzie 80 zwisy i nadmierną elongację wymieniono jako niewskazane w tej wadzie."},{"id":"Q-V-021","kind":"quiz","lecture":"V","slide":"81","topic":"Skolioza","difficulty":"medium","priority":true,"qtype":"multi","question":"Jakie składowe są charakterystyczne dla skoliozy strukturalnej?","options":["Odchylenie boczne","Rotacja kręgów","Torsja kręgów","Wyłącznie zwiększona lordoza"],"correct":[0,1,2],"why":"Skolioza jest wielopłaszczyznowa, nie tylko boczna."},{"id":"Q-V-022","kind":"quiz","lecture":"V","slide":"88","topic":"Skolioza","difficulty":"medium","priority":true,"qtype":"single","question":"Jaki zakres przypisano skoliozie II stopnia według klasyfikacji ze slajdu 88?","options":["0–10°","11–20°","31–60°","Powyżej 90°"],"correct":2,"why":"To podział przedstawiony w wykładzie, nie uniwersalny współczesny algorytm decyzji."},{"id":"Q-V-023","kind":"quiz","lecture":"V","slide":"89","topic":"Skolioza","difficulty":"medium","priority":true,"qtype":"single","question":"Jakiej metody pomiaru używa się do określenia kąta skoliozy na RTG?","options":["Kąta Cobba","Skali Borg","Metody PEP","Testu Vojty"],"correct":0,"why":"Kąt Cobba wyznacza się na zdjęciu radiologicznym."},{"id":"Q-V-024","kind":"quiz","lecture":"V","slide":"92","topic":"Skolioza","difficulty":"medium","priority":true,"qtype":"tf","question":"W skoliozie czynnościowej zawsze występuje trwała deformacja kształtu trzonów kręgów.","options":[],"correct":false,"why":"Skolioza czynnościowa nie wymaga zmian strukturalnych."},{"id":"Q-V-025","kind":"quiz","lecture":"V","slide":"101","topic":"Skolioza","difficulty":"hard","priority":true,"qtype":"order","question":"Ułóż sześć elementów korekcji skoliozy według wykładu.","options":["Uświadomienie wady","Optymalizacja warunków środowiskowych","Rozciąganie przykurczonych mięśni","Nauka postawy skorygowanej","Wzmacnianie osłabionych mięśni","Utrwalanie nawyku prawidłowej postawy"],"correct":[0,1,2,3,4,5],"why":"To kolejność punktów programu korekcji na slajdzie 101."},{"id":"Q-V-026","kind":"quiz","lecture":"V","slide":"103","topic":"Skolioza","difficulty":"basic","priority":true,"qtype":"single","ques "qtype":"single","question":"Co zaleca się wykonywać w dobie odłączenia drenu według wykładu?","options":["Tylko ćwiczenia przeponowe i przeciwzakrzepowe","Tylko intensywne bieganie","Wyłącznie skakanie","Nieprzerwany trening siłowy"],"correct":0,"why":"To ograniczenie podano na slajdzie 133."},{"id":"Q-VI-033","kind":"quiz","lecture":"VI","slide":"133","topic":"Bezpieczeństwo ćwiczeń","difficulty":"medium","priority":true,"qtype":"multi","question":"Które parametry trzeba kontrolować przed, w trakcie i po wysiłku?","options":["Tętno","Ciśnienie tętnicze","Liczbę oddechów","Kolor butów"],"correct":[0,1,2],"why":"Wykład wymienia tętno, ciśnienie i częstość oddychania."},{"id":"Q-VI-034","kind":"quiz","lecture":"VI","slide":"130","topic":"Rana, blizna i odleżyny","difficulty":"medium","priority":true,"qtype":"tf","question":"Slajd 130 zawiera szczegółową, stopniowaną klasyfikację odleżyn.","options":[],"correct":false,"why":"Slajd wymienia profilaktykę odleżyn, ale bez klasyfikacji."},{"id":"Q-VI-035","kind":"quiz","lecture":"VI","slide":"135","topic":"Rana, blizna i odleżyny","difficulty":"medium","priority":true,"qtype":"tf","question":"Prezentacja daje pełny opis techniki manualnej mobilizacji blizny.","options":[],"correct":false,"why":"Wspomina o bliznach i ruchomości, ale nie podaje kompletnej procedury."},{"id":"Q-VI-036","kind":"quiz","lecture":"VI","slide":"149","topic":"Mukowiscydoza","difficulty":"medium","priority":false,"qtype":"single","question":"Jaki zakres ciśnienia PEP podaje wykład?","options":["10–20 cm H₂O","1–2 atm","100–200 mm Hg","0 cm H₂O zawsze"],"correct":0,"why":"Slajd opisuje maskę PEP z oporem wydechowym."},{"id":"Q-VI-037","kind":"quiz","lecture":"VI","slide":"152-153","topic":"Mukowiscydoza","difficulty":"hard","priority":true,"qtype":"order","question":"Ułóż zakresy objętości oddechowej w drenażu autogennym.","options":["Mała objętość","Średnia objętość","Duża objętość"],"correct":[0,1,2],"why":"Praca odbywa się od oddechów małoobjętościowych do dużych."}],"opens":[{"id":"O-V-001","kind":"open","lecture":"V","slide":"7","topic":"Postawa i rozwój","difficulty":"basic","priority":false,"question":"Opisz pięć najważniejszych cech prawidłowej postawy ciała.","answer":"Głowa prosto, barki symetryczne, kręgosłup bez odchylenia w płaszczyźnie czołowej i z fizjologicznymi krzywiznami, miednica symetryczna, poprawne osie kończyn i wysklepienie stóp.","mandatory":["Głowa i barki","Kręgosłup","Miednica","Kończyny dolne i stopy"],"pitfall":"Nie myl wymuszonej postawy bacznej z nawykową."},{"id":"O-V-002","kind":"open","lecture":"V","slide":"16","topic":"Postawa i rozwój","difficulty":"medium","priority":true,"question":"Opisz chronologicznie powstawanie fizjologicznych krzywizn kręgosłupa.","answer":"Życie płodowe: dominuje kifoza; 3.–4. miesiąc: lordoza szyjna; 9.–12. miesiąc: lordoza lędźwiowa; 12.–14. miesiąc: widoczne krzywizny; 3. rok: względna stabilizacja; około 7. roku: ukształtowanie.","mandatory":["Okres płodowy","3.–4. miesiąc","9.–12. miesiąc","3. rok i 7. rok"],"pitfall":"Nie utożsamiaj rozwoju dziecka z kliniczną pionizacją chorego po operacji."},{"id":"O-V-003","kind":"open","lecture":"V","slide":"18-19","topic":"Postawa i rozwój","difficulty":"hard","priority":true,"question":"Wymień i scharakteryzuj cztery stadia rozwoju wg Vojty.","answer":"I zgięciowe (urodzenie–6. tydz., przewaga zginaczy), I wyprostne (7.–16. tydz., unoszenie głowy, wyprost kończyn), II zgięciowe (5.–8. miesiąc, siady i podporowe ustawienie), II wyprostne (9.–12. miesiąc, wyprost bioder i stawanie).","mandatory":["I zgięciowe","I wyprostne","II zgięciowe","II wyprostne"],"pitfall":"Pamiętaj o naprzemienności zgięcie–wyprost."},{"id":"O-V-004","kind":"open","lecture":"V","slide":"28","topic":"Etiologia i diagnostyka","difficulty":"medium","priority":false,"question":"Jak przeprowadzić oględziny postawy w trzech płaszczyznach obserwacji?","answer":"Z przodu: oś, poziom barków i miednicy, kolana/stopy; z boku: głowa, kifoza/lordoza, miednica, brzuch; z tyłu: wyrostki kolczyste, łopatki, biodra, fałdy, pięty.","mandatory":["Widok z przodu","Widok z boku","Widok z tyłu"],"pitfall":"Nie opieraj się wyłącznie na jednym widoku."},{"id":"O-V-005","kind":"open","lecture":"V","slide":"44","topic":"Analiza chodu","difficulty":"medium","priority":false,"question":"Wyjaśnij, jak dzieli się cykl chodu i jakie ma proporcje.","answer":"Cykl trwa od kontaktu pięty do kolejnego kontaktu tej samej pięty. Faza podporowa to ok. 60%, faza przenoszenia ok. 40%. W podporze następuje przyjęcie i przeniesienie ciężaru; w swing kończyna przesuwa się do przodu.","mandatory":["Definicja cyklu","Faza podporowa 60%","Faza przenoszenia 40%"],"pitfall":"Nie zamieniaj wartości 60% i 40%."},{"id":"O-V-006","kind":"open","lecture":"V","slide":"51,52,55","topic":"Analiza chodu","difficulty":"hard","priority":false,"question":"Porównaj chód antalgiczny, brodzący i koszący.","answer":"Antalgiczny: skrócenie obciążania bolesnej nogi; brodzący: wysokie unoszenie kolana przez opadanie stopy; koszący: zataczanie łuku sztywną niedowładną nogą.","mandatory":["Antalgiczny","Brodzący","Koszący"],"pitfall":"Przyczyny i wzorzec ruchu są różne."},{"id":"O-V-007","kind":"open","lecture":"V","slide":"61","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"question":"Scharakteryzuj plecy okrągłe i ogólny kierunek korekcji.","answer":"Pogłębiona kifoza piersiowa, protrakcyjna głowa i barki, przykurczone mięśnie piersiowe i osłabione mięśnie grzbietu. Korekcja: rozciąganie przykurczonych struktur, wzmacnianie osłabionych, edukacja postawy.","mandatory":["Pogłębiona kifoza","Protrakcja","Grupy mięśniowe","Kierunek korekcji"],"pitfall":"Nie myl z pogłębioną lordozą."},{"id":"O-V-008","kind":"open","lecture":"V","slide":"66","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"question":"Scharakteryzuj plecy wklęsłe oraz główne grupy mięśniowe.","answer":"Pogłębiona lordoza lędźwiowa i przodopochylenie miednicy; osłabienie brzucha i pośladków, przykurcze zginaczy bioder i prostowników lędźwi. Korekcja miednicy oraz równowaga siły i długości mięśni.","mandatory":["Lordoza i miednica","Osłabione mięśnie","Przykurczone mięśnie","Korekcja"],"pitfall":"Nie myl lordozy szyjnej z lędźwiową."},{"id":"O-V-009","kind":"open","lecture":"V","slide":"71-80","topic":"Wady kręgosłupa","difficulty":"hard","priority":true,"question":"Jak odróżnić plecy okrągło-wklęsłe od płaskich i jakie są zasady korekcji?","answer":"Okrągło-wklęsłe: zwiększone obie krzywizny, korekcja odcinkowa z ustabilizowaniem drugiego odcinka. Płaskie: krzywizny zmniejszone, gorsza amortyzacja; ćwiczenia dobrane do ograniczenia ruchomości, bez nadmiernej elongacji opisanej jako niewskazana.","mandatory":["Okrągło-wklęsłe","Płaskie","Stabilizacja odcinkowa","Unikanie hiperkorekcji"],"pitfall":"Nie stosuj jednej metody korekcji obu wad."},{"id":"O-V-010","kind":"open","lecture":"V","slide":"81","topic":"Skolioza","difficulty":"hard","priority":true,"question":"Wyjaśnij, dlaczego skolioza jest deformacją wielopłaszczyznową, oraz podaj podstawowe objawy.","answer":"Boczne odchylenie kręgosłupa łączy się z rotacją i torsją kręgów. Objawy obejmują nierówne barki/łopatki, asymetrię talii, garb żebrowy i zaburzenie osi tułowia.","mandatory":["Odchylenie boczne","Rotacja","Torsja","Asymetria lub garb żebrowy"],"pitfall":"Nie opisuj skoliozy tylko jako łuku w płaszczyźnie czołowej."},{"id":"O-V-011","kind":"open","lecture":"V","slide":"88","topic":"Skolioza","difficulty":"hard","priority":true,"question":"Podaj cztery poziomy zaawansowania skrzywienia według wykładowego podziału z kątem Cobba.","answer":"Postawa skoliotyczna do 10°; I stopień do 30°; II 31–60°; III powyżej 60°. Są to progi podane w konkretnym wykładzie.","mandatory":["Do 10°","Do 30°","31–60°","Powyżej 60°"],"pitfall":"Nie przedstawiaj tego wykładowego podziału jako jedynego standardu klinicznego."},{"id":"O-V-012","kind":"open","lecture":"V","slide":"101","topic":"Skolioza","difficulty":"hard","priority":true,"question":"Wymień sześć elementów postępowania korekcyjnego w skoliozie.","answer":"Uświadomienie wady; poprawa warunków środowiskowych; rozciąganie przykurczonych mięśni; nauka pozycji skorygowanej; wzmacnianie osłabionych grup; utrwalenie prawidłowego nawyku.","mandatory":["Uświadomienie","Środowisko","Rozciąganie","Pozycja skorygowana","Wzmacnianie","Nawyk"],"pitfall":"Zachowaj kolejność pracy nad korekcją."},{"id":"O-V-013","kind":"open","lecture":"V","slide":"103,105","topic":"Skolioza","difficulty":"medium","priority":true,"question":"Wyjaśnij skrót FED i etapy sesji opisane w wykładzie.","answer":"FED oznacza fiksację, elongację i derotację. Wykład przedstawia przygotowanie fizykoterapeutyczne, działanie aparatu oraz indywidualne ćwiczenia po zabiegu.","mandatory":["Fiksacja, elongacja, derotacja","Przygotowanie","Aparat","Ćwiczenia"],"pitfall":"Nie myl FED z techniką FET stosowaną oddechowo."},{"id":"O-V-014","kind":"open","lecture":"V","slide":"108,114","topic":"Wady klatki piersiowej","difficulty":"medium","priority":true,"question":"Porównaj klatkę piersiową lejkowatą i kurzą.","answer":"Lejkowata: zapadnięty mostek; kurza: mostek uwypuklony do przodu. Obie mogą pogarszać mechanikę oddychania i wymagać indywidualnej korekcji postawy, ruchomości i mięśni klatki.","mandatory":["Lejkowata","Kurza","Wpływ na mechanikę oddechu"],"pitfall":"Nie odwracaj kierunku deformacji mostka."},{"id":"O-V-015","kind":"open","lecture":"V","slide":"119,124","topic":"Wady kolan i stóp","difficulty":"medium","priority":true,"question":"Odróżnij koślawość od szpotawości kolan i podaj podstawowe cechy.","answer":"Koślawość: kolana zbliżone, kostki przyśrodkowe oddalone (X). Szpotawość: kolana oddalone, kończyny łukowate (O).","mandatory":["Koślawość X","Szpotawość O"],"pitfall":"W skojarzeniu zapamiętaj ustawienie kolan, a nie tylko stóp."},{"id":"O-VI-001","kind":"open","lecture":"VI","slide":"9","topic":"Oddychanie i wentylacja","difficulty":"medium","priority":false,"question":"Wymień i opisz trzy tory oddychania oraz tor mieszany.","answer":"Górnożebrowy: ruch górnej klatki; dolnożebrowy: rozszerzanie dolnych żeber na boki; przeponowy: uwypuklenie brzucha; mieszany: współudział piersi i przepony.","mandatory":["Górnożebrowy","Dolnożebrowy","Przeponowy","Mieszany"],"pitfall":"W prezentacji tor mieszany jest wskazany jako szczególnie efektywny."},{"id":"O-VI-002","kind":"open","lecture":"VI","slide":"20","topic":"Techniki oddechowe","difficulty":"medium","priority":true,"question":"Opisz podstawowe zasady nauki prawidłowego oddychania.","answer":"Rozpoczęcie wydechem, wdech nosem, dłuższy wydech ustami (zwykle 1:2), świadoma kontrola toru, krótka seria 3–4 powtórzeń i przerwy dla uniknięcia hiperwentylacji.","mandatory":["Start od wydechu","Nos/usta","Dłuższy wydech","3–4 powtórzenia","Ochrona przed hiperwentylacją"],"pitfall":"Nie wprowadzaj bez potrzeby szybkich głębokich oddechów."},{"id":"O-VI-003","kind":"open","lecture":"VI","slide":"25","topic":"Oczyszczanie dróg oddechowych","difficulty":"hard","priority":true,"question":"Wyjaśnij różnicę między drenażem statycznym i dynamicznym oraz podaj ważne ograniczenie.","answer":"Statyczny polega na utrzymaniu pozycji wykorzystującej grawitację; dynamiczny wykorzystuje kontrolowane pochylenia tułowia. Przeciwwskazania do drenażu obejmują m.in. świeży zawał, krwawienie i zaburzenia krążenia.","mandatory":["Drenaż statyczny","Drenaż dynamiczny","Przykład przeciwwskazania"],"pitfall":"Przeciwwskazania do drenażu nie są tożsame z przeciwwskazaniami do pionizacji."},{"id":"O-VI-004","kind":"open","lecture":"VI","slide":"34","topic":"Oczyszczanie dróg oddechowych","difficulty":"hard","priority":true,"question":"Opisz podstawowe zasady oklepywania i trzy przeciwwskazania.","answer":"Oklepywanie nad segmentami klatki, poza kręgosłupem i nerkami, zwykle do 3–4 min w serii. Przeciwwskazania to np. złamane żebra, osteoporoza, krwawienie, niezdrenowana odma.","mandatory":["Omijanie kręgosłupa i nerek","Czas","Przeciwwskazania"],"pitfall":"Wykład opisuje procedurę terapeutyczną, nie zabieg dla nieprzeszkolonej osoby."},{"id":"O-VI-005","kind":"open","lecture":"VI","slide":"39","topic":"Efektywny kaszel","difficulty":"hard","priority":true,"question":"Porównaj efektywny kaszel i FET oraz powiedz, kiedy kaszel może wymagać wspomagania.","answer":"Kaszel ma usunąć wydzielinę. FET to natężony wydech przez otwarte usta z głoską „h”. Kaszel wspomagany może być potrzebny przy słabej sile mięśni oddechowych; wykład przestrzega przed FET przy nadreaktywności kaszlu.","mandatory":["Cel kaszlu","FET","Słaby kaszel","Nadreaktywność"],"pitfall":"Nie utożsamiaj FET z każdym kaszlnięciem."},{"id":"O-VI-006","kind":"open","lecture":"VI","slide":"43,44,50","topic":"Oczyszczanie dróg oddechowych","difficulty":"hard","priority":true,"question":"Podaj kolejność elementów ACBT, drenażu autogennego i ewakuacji śluzu.","answer":"ACBT: kontrola oddechu → ekspansja klatki → FET. Drenaż autogenny: małe → średnie → duże objętości. Ewakuacja śluzu: rozrzedzenie → oderwanie → przesunięcie → odkrztuszenie.","mandatory":["ACBT 3 etapy","Autogenny 3 fazy","Śluz 4 kroki"],"pitfall":"To trzy różne sekwencje, nie jedna procedura."},{"id":"O-VI-007","kind":"open","lecture":"VI","slide":"55","topic":"Choroby płuc","difficulty":"medium","priority":false,"question":"Porównaj restrykcję i obturację oraz podaj przykłady.","answer":"Restrykcja ogranicza rozprężanie i objętość płuc, np. przy zniekształceniach klatki. Obturacja zwiększa opór dróg oddechowych, zwłaszcza w wydechu, np. w astmie i POChP.","mandatory":["Restrykcja","Obturacja","Przykłady"],"pitfall":"Nie myl ograniczenia objętości z oporem przepływu."},{"id":"O-VI-008","kind":"open","lecture":"VI","slide":"84","topic":"Choroby płuc","difficulty":"hard","priority":true,"question":"Jakie zasady wydechu są ważne w usprawnianiu osoby z rozedmą według wykładu?","answer":"Krótki spokojny wdech, wydłużony wydech przez zwężone wargi bez nadmiernego parcia; unikanie nadmuchiwania balonika w schemacie wykładowym.","mandatory":["Krótki wdech","Wydłużony wydech","Zasznurowane usta","Unikanie parcia"],"pitfall":"Nie interpretuj tego jako samodzielnego programu terapeutycznego."},{"id":"O-VI-009","kind":"open","lecture":"VI","slide":"114","topic":"Bezpieczeństwo ćwiczeń","difficulty":"medium","priority":true,"question":"Wyjaśnij różnicę między przeciwwskazaniami do usprawniania a przeciwwskazaniami do pionizacji.","answer":"Wykład podaje listy przeciwwskazań do drenażu, oklepywania i określonego usprawniania; nie ma pełnej odrębnej listy do każdej pionizacji. Podczas pionizacji wymaga obserwacji oznak niedotlenienia.","mandatory":["Rozróżnienie list","Brak pełnej listy pionizacji","Obserwacja pacjenta"],"pitfall":"Nie przenoś automatycznie przeciwwskazań z jednej procedury na drugą."},{"id":"O-VI-010","kind":"open","lecture":"VI","slide":"119","topic":"Efektywny kaszel","difficulty":"hard","priority":true,"question":"Przedstaw naukę efektywnego kaszlu po torakochirurgii zgodnie ze slajdami.","answer":"Wyjaśnienie celu i przygotowanie chusteczek; pozycja woźnicy; ćwiczenia przeponowe; kaszlnięcia prowokowane na szczycie wydechu (3–4 w 2–3 seriach); stabilizacja operowanej okolicy.","mandatory":["Cel i przygotowanie","Pozycja","Oddech przeponowy","Kaszlnięcia","Stabilizacja rany"],"pitfall":"Ból rany może utrudniać kaszel."},{"id":"O-VI-011","kind":"open","lecture":"VI","slide":"122-125","topic":"Rana, blizna i odleżyny","difficulty":"hard","priority":true,"question":"Jak wykład opisuje stabilizację rany i czego nie wyjaśnia?","answer":"Stabilizacja okolicy operowanej własnymi rękami, przez terapeutę albo specjalnym pasem/szelkami; dobrana do dostępu operacyjnego. Nie opisano kompletnej procedury zmiany opatrunku, zabezpieczenia szwów i drenów przed pionizacją.","mandatory":["Metody stabilizacji","Dobór do dostępu","Brak protokołu opatrunku"],"pitfall":"Nie dopisuj samodzielnie instrukcji opatrunkowej."},{"id":"O-VI-012","kind":"open","lecture":"VI","slide":"131","topic":"Torakochirurgia i pionizacja","difficulty":"hard","priority":true,"question":"Wymień etapy usprawniania po torakochirurgii według dób.","answer":"Doba 0: półsiad, oddech, kaszel ze stabilizacją, ruchy bierne. Doby 1–3: ruchy czynne, pionizacja. Doby 4–6: większe ćwiczenia, spacery. Od 6. doby: trening wytrzymałościowy. Później dom i rehabilitacja ambulatoryjna.","mandatory":["Doba 0","Doby 1–3","Doby 4–6","Od 6. doby","Kontynuacja"],"pitfall":"Nie pomijaj asekuracji i monitorowania."},{"id":"O-VI-013","kind":"open","lecture":"VI","slide":"132","topic":"Torakochirurgia i pionizacja","difficulty":"hard","priority":true,"question":"Wymień kolejne etapy pionizacji po operacji i zasady bezpieczeństwa.","answer":"Siad płaski → siad ze spuszczonymi nogami → stanie przy łóżku → pełna pionizacja z asekuracją. Pacjenta obserwuje się pod kątem zasinienia warg/palców/paznokci i potu na czole; przy tych objawach ćwiczenia natychmiast się przerywa.","mandatory":["Siad płaski","Nogi spuszczone","Stanie przy łóżku","Asekuracja","Oznaki niedotlenienia"],"pitfall":"Nie pomyl objawów alarmowych z przewidywalnym zmęczeniem."},{"id":"O-VI-014","kind":"open","lecture":"VI","slide":"133","topic":"Bezpieczeństwo ćwiczeń","difficulty":"medium","priority":true,"question":"Jakie parametry i ograniczenia monitorować po 6. dobie po operacji?","answer":"Tętno, ciśnienie, liczba oddechów przed, w trakcie i po ćwiczeniach. W dobie usunięcia drenu wykład pozwala tylko na ćwiczenia przeponowe i przeciwzakrzepowe; wymienia gorączkę i stan zapalny jako ograniczenia ćwiczeń.","mandatory":["Tętno","Ciśnienie","Oddechy","Dren","Gorączka/stan zapalny"],"pitfall":"Brak liczbowych progów saturacji w prezentacji."},{"id":"O-VI-015","kind":"open","lecture":"VI","slide":"130","topic":"Rana, blizna i odleżyny","difficulty":"medium","priority":true,"question":"Jakie informacje dotyczące odleżyn i blizn można znaleźć w prezentacji?","answer":"Wykład wymienia profilaktykę odleżyn, zapobieganie przykurczom, stopniowe rozciąganie blizny i usprawnianie przy ograniczeniach ruchu. Nie omawia pełnej oceny rany, stopni odleżyn ani konkretnego protokołu mobilizacji blizny.","mandatory":["Profilaktyka","Stopniowe rozciąganie","Brak oceny i techniki"],"pitfall":"Odróżniaj cele rehabilitacji od szczegółowej procedury."},{"id":"O-VI-016","kind":"open","lecture":"VI","slide":"138-154","topic":"Mukowiscydoza","difficulty":"hard","priority":true,"question":"Wymień metody oczyszczania oskrzeli w mukowiscydozie opisane w wykładzie.","answer":"Kaszel i kaszel wspomagany, drenaż ułożeniowy, FET, aktywny cykl oddechowy, drenaż autogenny, PEP, Flutter i oscylacyjny ucisk klatki.","mandatory":["Kaszel","Drenaż","FET/ACBT","PEP/Flutter","Drenaż autogenny"],"pitfall":"Dobór techniki zależy od tolerancji i stanu chorego."}],"cases":[{"id":"C-V-001","kind":"case","lecture":"V","slide":"61","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"title":"Rozpoznanie pleców okrągłych","scenario":"Podczas oceny sylwetki widzisz mocno zarysowaną kifozę piersiową oraz głowę i barki wysunięte do przodu. Jaki typ wady opisuje wykład i jaki ogólny kierunek korekcji podaje?","question":"Jak rozpoznać wadę i jaki ogólny kierunek korekcji podaje wykład?","answer":"To plecy okrągłe. Wykład proponuje rozciąganie przykurczonych mięśni piersiowych, wzmacnianie osłabionych mięśni grzbietu i edukację postawy.","mandatory":["Rozpoznanie pleców okrągłych","Zwiększona kifoza","Kierunek korekcji"],"pitfall":"Scenariusz dydaktyczny na podstawie cech wady, nie indywidualne rozpoznanie."},{"id":"C-V-002","kind":"case","lecture":"V","slide":"66","topic":"Wady kręgosłupa","difficulty":"medium","priority":true,"title":"Rozpoznanie pleców wklęsłych","scenario":"Pacjent ma znacznie pogłębioną lordozę lędźwiową, uwypuklony brzuch i przodopochylenie miednicy. Jaka to wada i które grupy mięśni obejmuje wykładowa korekcja?","question":"Jaka wada odpowiada tym cechom i które grupy mięśni dotyczą korekcji?","answer":"To plecy wklęsłe. Wykład omawia wzmacnianie mięśni brzucha i pośladków oraz rozciąganie skróconych zginaczy bioder i prostowników lędźwiowych.","mandatory":["Plecy wklęsłe","Lordoza i przodopochylenie","Dobór grup mięśni"],"pitfall":"Ćwiczenia trzeba indywidualizować."},{"id":"C-V-003","kind":"case","lecture":"V","slide":"75","topic":"Wady kręgosłupa","difficulty":"hard","priority":true,"title":"Korekcja kompensacji","scenario":"Podczas próby zmniejszenia kifozy piersiowej pacjent nadmiernie pogłębia lordozę lędźwiową. Jaką zasadę ćwiczeń wskazuje wykład o plecach okrągło-wklęsłych?","question":"Jaką zasadę stabilizacji zastosować zgodnie z wykładem?","answer":"Podczas korekcji jednej krzywizny trzeba stabilizować drugi odcinek, zapobiegając kompensacji; należy unikać hiperkorekcji.","mandatory":["Stabilizacja drugiego odcinka","Bez hiperkorekcji"],"pitfall":"Ćwiczenie jest ilustracją zasady odcinkowej stabilizacji."},{"id":"C-V-004","kind":"case","lecture":"V","slide":"88","topic":"Skolioza","difficulty":"medium","priority":true,"title":"Interpretacja wykładowych zakresów","scenario":"W opisie RTG skoliozy podano kąt Cobba 45°. Do jakiej kategorii w podziale ze slajdu 88 należy ten wynik?","question":"Jaki stopień skoliozy odpowiada podanemu wynikowi według slajdu?","answer":"Do II stopnia skoliozy według wykładowego podziału 31–60°. Nie jest to automatyczna decyzja o leczeniu.","mandatory":["45° leży w 31–60°","II stopień"],"pitfall":"Odpowiedź dotyczy wyłącznie klasyfikacji z prezentacji."},{"id":"C-V-005","kind":"case","lecture":"V","slide":"119","topic":"Wady kolan i stóp","difficulty":"basic","priority":true,"title":"Rozpoznanie koślawości kolan","scenario":"Podczas stania kolana zbliżają się do siebie, a kostki przyśrodkowe pozostają rozdzielone. Co opisano?","question":"Jak nazywa się opisana wada osi kończyn?","answer":"Koślawość kolan, typ X. Szpotawość jest odwrotna: kolana są oddalone.","mandatory":["Koślawość","Kolana blisko","Kostki daleko"],"pitfall":"To ćwiczenie rozpoznawania cechy sylwetki."},{"id":"C-V-006","kind":"case","lecture":"V","slide":"131","topic":"Wady kolan i stóp","difficulty":"medium","priority":true,"title":"Rozpoznanie stopy końsko-szpotawej","scenario":"U dziecka opisano przywiedzenie przodostopia, szpotawość pięty i ustawienie końskie. Jaką wadę przedstawia wykład?","question":"Jaką wadę stopy opisują wymienione cechy?","answer":"Stopę końsko-szpotawą. Prezentacja wymienia m.in. postępowanie gipsowe, ortezy i ćwiczenia ukierunkowane na ustawienie stopy.","mandatory":["Stopa końsko-szpotawa","Trzy składowe"],"pitfall":"Opis ma charakter edukacyjny."},{"id":"C-VI-001","kind":"case","lecture":"VI","slide":"132","topic":"Torakochirurgia i pionizacja","difficulty":"hard","priority":true,"title":"Pierwsze uruchamianie po operacji","scenario":"Pacjent po zabiegu jest jeszcze w łóżku. Jaką kolejność uruchamiania przedstawia slajd 132?","question":"W jakiej kolejności prowadzi się pionizację według wykładu?","answer":"Siad płaski w łóżku, następnie siad ze spuszczonymi nogami, stanie przy łóżku, pełna pionizacja z asekuracją terapeuty.","mandatory":["Siad płaski","Nogi spuszczone","Stanie","Asekuracja"],"pitfall":"To kolejność ze slajdu, nie uniwersalny schemat dla każdego pacjenta."},{"id":"C-VI-002","kind":"case","lecture":"VI","slide":"132","topic":"Bezpieczeństwo ćwiczeń","difficulty":"hard","priority":true,"title":"Objawy alarmowe podczas pionizacji","scenario":"W czasie pionizacji pojawia się zasinienie warg, końców palców i krople potu na czole. Co wynika z wykładu?","question":"Jak powinien zareagować terapeuta według slajdu?","answer":"Należy natychmiast przerwać ćwiczenia, ponieważ slajd wskazuje te objawy jako oznaki niedotlenienia.","mandatory":["Przerwanie ćwiczeń","Oznaki niedotlenienia"],"pitfall":"Nie kontynuować ćwiczenia dla osiągnięcia planowanej liczby powtórzeń."},{"id":"C-VI-003","kind":"case","lecture":"VI","slide":"119","topic":"Efektywny kaszel","difficulty":"hard","priority":true,"title":"Kaszel po zabiegu","scenario":"Pacjent po torakochirurgii ma trudność z odkrztuszaniem z powodu bólu w miejscu cięcia. Jakie działania przygotowawcze opisuje wykład?","question":"Jakie czynności ułatwiające odkrztuszanie opisano w materiale?","answer":"Ćwiczenia oddechu przeponowego, nauka kaszlu w dogodnej pozycji oraz stabilizacja okolicy operowanej przez chorego, terapeutę lub odpowiedni pas/szelki.","mandatory":["Oddech przeponowy","Pozycja","Stabilizacja rany"],"pitfall":"Wykład nie podaje kompletnej procedury opatrunkowej."},{"id":"C-VI-004","kind":"case","lecture":"VI","slide":"133","topic":"Torakochirurgia i pionizacja","difficulty":"medium","priority":true,"title":"Doba usunięcia drenu","scenario":"Pacjentowi po operacji usunięto dren. Jakie ograniczenie ćwiczeń podaje slajd 133?","question":"Jaki zakres ćwiczeń podano na ten dzień?","answer":"W dniu usunięcia drenu wykład ogranicza ćwiczenia do przeponowych i przeciwzakrzepowych.","mandatory":["Przeponowe","Przeciwzakrzepowe"],"pitfall":"To zapis wykładu, nie indywidualne zlecenie kliniczne."},{"id":"C-VI-005","kind":"case","lecture":"VI","slide":"39","topic":"Efektywny kaszel","difficulty":"hard","priority":true,"title":"Nadreaktywność kaszlu","scenario":"U osoby z nasilonym odruchem kaszlowym terapeuta rozważa technikę FET. Co sugeruje wykład?","question":"Czy FET jest właściwą techniką w takiej sytuacji według wykładu?","answer":"Wykład odradza FET przy nadreaktywności kaszlu i podkreśla, że jest techniką obciążającą; należy ją dobrać do tolerancji.","mandatory":["Nadreaktywność","Ograniczenie FET"],"pitfall":"Nie jest to zalecenie zastępowania oceny terapeuty."},{"id":"C-VI-006","kind":"case","lecture":"VI","slide":"36","topic":"Oczyszczanie dróg oddechowych","difficulty":"hard","priority":true,"title":"Ryzyko oklepywania","scenario":"Chory ma świeże złamanie żebra i planowane jest oklepywanie klatki. Co mówi lista przeciwwskazań w prezentacji?","question":"Czy oklepywanie jest właściwe w tej sytuacji według wykładowych przeciwwskazań?","answer":"Złamanie żeber jest na liście przeciwwskazań do oklepywania. Nie należy traktować oklepywania jako bezpiecznego automatycznie u każdego chorego.","mandatory":["Złamanie żeber","Przeciwwskazanie do oklepywania"],"pitfall":"Nie przenoś tego jako odrębnej zasady pionizacji."},{"id":"C-VI-007","kind":"case","lecture":"VI","slide":"30","topic":"Oczyszczanie dróg oddechowych","difficulty":"hard","priority":true,"title":"Drenaż i krwawienie","scenario":"Osoba z aktywnym krwawieniem z dróg oddechowych ma zostać ułożona w pozycji drenażowej. Co mówi wykład?","question":"Jaką decyzję uzasadnia lista przeciwwskazań do drenażu?","answer":"Krwawienie z dróg oddechowych znajduje się wśród przeciwwskazań do drenażu ułożeniowego.","mandatory":["Krwawienie","Przeciwwskazanie do drenażu"],"pitfall":"Scenariusz ilustruje ograniczenie z określonej procedury."},{"id":"C-VI-008","kind":"case","lecture":"VI","slide":"130","topic":"Rana, blizna i odleżyny","difficulty":"medium","priority":true,"title":"Weryfikacja brakującej wiedzy","scenario":"Student ma podać pełną klasyfikację stopni odleżyn wyłącznie na podstawie obu prezentacji. Jak powinien odpowiedzieć?","question":"Czy można wskazać stopnie odleżyn wyłącznie z dostępnych slajdów?","answer":"Nie ma podstaw do odtworzenia pełnej klasyfikacji z tych materiałów. Wykład VI wspomina o profilaktyce odleżyn, ale nie podaje stopni i szczegółowej oceny.","mandatory":["Wskazanie braku","Wspomniana profilaktyka"],"pitfall":"Nie wymyślaj klasyfikacji, jeśli celem jest nauka z tych slajdów."}],"coverage":{"V":[{"name":"Etapy rehabilitacji i pionizacji","status":"CZĘŚCIOWO","slide":"16–19, 44–46, 101, 103–105","note":"Etapy rozwoju, chodu i korekcji; brak klinicznego schematu pionizacji."},{"name":"Przeciwwskazania do pionizacji","status":"BRAK","slide":"","note":"Nie podano odrębnych przeciww
