<script>
'use strict';
const DATA = JSON.parse(document.getElementById('study-data').textContent);
const CARDS=DATA.cards, QUIZZES=DATA.quizzes, OPENS=DATA.opens, CASES=DATA.cases, ALL=[...CARDS,...QUIZZES,...OPENS,...CASES];
const KEY='fizjo_trenazer_exam_v1';
const NAV=[['home','Panel główny','⌂'],['flash','Fiszki','▤'],['quiz','Quiz ABCD','☑'],['recall','Odpowiedzi z pamięci','✎'],['case','Przypadki praktyczne','♧'],['exam','Próbny egzamin','◷'],['hard','Trudne i zapisane','↻'],['catalog','Bank pytań','⌕'],['coverage','Zakres egzaminu','≡'],['gallery','Schematy ze slajdów','▧'],['settings','Postępy i ustawienia','⚙']];
const ROUTE_NAMES=Object.fromEntries(NAV.map(([a,b])=>[a,b]));
const LECT={V:'Wykład V · Wady postawy',VI:'Wykład VI · Rehabilitacja pulmonologiczna'};
const DIFS={basic:'Podstawowy',medium:'Średni',hard:'Trudny'};
const TYPE_LABELS={card:'Fiszka',quiz:'Quiz',open:'Odpowiedź otwarta',case:'Przypadek'};
const $=(id)=>document.getElementById(id);
const esc=(s='')=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){const e=$('toast'); e.textContent=message;e.classList.remove('hidden');window.clearTimeout(toast.t);toast.t=window.setTimeout(()=>e.classList.add('hidden'),3200)}
function safeState(x){const b={version:1,cards:{},records:{},sessions:[],theme:'light',bookmarks:[]};if(!x||typeof x!=='object')return b;if(x.cards&&typeof x.cards==='object')for(const [id,o] of Object.entries(x.cards)){if(!/^F-(V|VI)-\d+$/.test(id)||!o||typeof o!=='object')continue;b.cards[id]={reps:clip(o.reps,0,999),ease:clip(o.ease,1.3,3.6,2.5),interval:clip(o.interval,0,3650),due:clip(o.due,0,9999999999999),right:clip(o.right,0,99999),wrong:clip(o.wrong,0,99999),last:clip(o.last,0,9999999999999)}}if(x.records&&typeof x.records==='object')for(const [id,o]of Object.entries(x.records)){if(!/^[FQOC]-(V|VI)-\d+$/.test(id)||!o||typeof o!=='object')continue;b.records[id]={right:clip(o.right,0,99999),wrong:clip(o.wrong,0,99999),last:clip(o.last,0,9999999999999)}}if(Array.isArray(x.sessions))b.sessions=x.sessions.slice(-100).filter(o=>o&&typeof o==='object').map(o=>({time:clip(o.time,0,9999999999999),mode:String(o.mode||'').slice(0,24),lecture:String(o.lecture||'').slice(0,20),items:clip(o.items,0,1000),autoCorrect:clip(o.autoCorrect,0,1000),autoTotal:clip(o.autoTotal,0,1000),selfGood:clip(o.selfGood,0,1000),selfTotal:clip(o.selfTotal,0,1000),wrongIds:Array.isArray(o.wrongIds)?o.wrongIds.filter(z=>typeof z==='string').slice(0,100):[]}));b.theme=x.theme==='dark'?'dark':'light';b.bookmarks=Array.isArray(x.bookmarks)?[...new Set(x.bookmarks.filter(id=>typeof id==='string'&&/^[FQOC]-(V|VI)-\d{3}$/.test(id)))].slice(0,300):[];return b}
function clip(x,a,b,d=a){const n=Number(x);return Number.isFinite(n)?Math.min(b,Math.max(a,n)):d}
let persistent=true;let state;try{state=safeState(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(_){state=safeState(null);persistent=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persistent=true}catch(e){persistent=false;$('storage-indicator').textContent='⚠ Brak zapisu';}}
let route='home', filters={lecture:'both',topic:'all',difficulty:'all',priority:false},session=null,finished=null,mobileMenu=false;let catalogFilters={search:'',lecture:'both',kind:'all',priority:false,limit:24};
function setTheme(){document.documentElement.dataset.theme=state.theme;$('theme-toggle').textContent=state.theme==='dark'?'☀':'☾';$('theme-toggle').title=state.theme==='dark'?'Jasny motyw':'Ciemny motyw'}
setTheme();
const topics=[...new Set(ALL.map(q=>q.topic))].sort((a,b)=>a.localeCompare(b,'pl'));
function opt(value,label,current){return `<option value="${esc(value)}"${current===value?' selected':''}>${esc(label)}</option>`}
function filterPanel(){return `<div class="formbar" role="group" aria-label="Filtry nauki"><div class="field"><label for="filter-lecture">Wykład</label><select id="filter-lecture">${opt('both','Oba wykłady',filters.lecture)}${opt('V','Wykład V',filters.lecture)}${opt('VI','Wykład VI',filters.lecture)}</select></div><div class="field wide"><label for="filter-topic">Temat</label><select id="filter-topic">${opt('all','Wszystkie tematy',filters.topic)}${topics.map(x=>opt(x,x,filters.topic)).join('')}</select></div><div class="field"><label for="filter-difficulty">Trudność</label><select id="filter-difficulty">${opt('all','Każda',filters.difficulty)}${Object.entries(DIFS).map(([k,v])=>opt(k,v,filters.difficulty)).join('')}</select></div><label class="filter-check"><input id="filter-priority" type="checkbox" ${filters.priority?'checked':''}> Priorytety egzaminacyjne</label></div>`}
function matches(q,{lecture=filters.lecture,topic=filters.topic,difficulty=filters.difficulty,priority=filters.priority}={}){return(lecture==='both'||q.lecture===lecture)&&(topic==='all'||q.topic===topic)&&(difficulty==='all'||q.difficulty===difficulty)&&(!priority||q.priority)}
function available(items){return items.filter(q=>matches(q))}
function getRec(q){return state.records[q.id]||{right:0,wrong:0,last:0}}
function dueCards(){const now=Date.now();return CARDS.filter(q=>{const r=state.cards[q.id];return r&&r.due<=now&&(r.right+r.wrong)>0})}
function mastered(q){const r=state.cards[q.id];return !!r&&r.reps>=2}
function randShuffle(xs){const arr=[...xs];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[j],arr[i]]=[arr[i],arr[j]]}return arr}
function bestCards(pool,limit=24,daily=false){const now=Date.now();let due=pool.filter(q=>{const r=state.cards[q.id];return r&&r.due<=now&&r.right+r.wrong>0}).sort((a,b)=>((state.cards[a.id]?.due||0)-(state.cards[b.id]?.due||0)));let fresh=randShuffle(pool.filter(q=>!state.cards[q.id]));let learned=randShuffle(pool.filter(q=>state.cards[q.id]&&state.cards[q.id].due>now));return (daily?[...due,...fresh.slice(0,Math.max(0,limit-due.length))]:[...due,...fresh,...learned]).slice(0,limit)}
function recStep(q,score){const now=Date.now();const r=state.cards[q.id]||{reps:0,ease:2.5,interval:0,right:0,wrong:0,last:0};r.last=now;if(score===0){r.reps=0;r.wrong++;r.ease=Math.max(1.3,r.ease-.22);r.interval=0;r.due=now+10*60000}else{r.reps++;r.right++;r.ease=Math.min(3.5,Math.max(1.3,r.ease+(score===3?.12:score===2?.02:-.14)));r.interval=score===1?1:r.reps===1?(score===3?3:1):r.reps===2?(score===3?6:3):Math.min(3650,Math.max(1,Math.ceil(Math.max(1,r.interval)*r.ease*(score===3?1.25:1))));r.due=now+r.interval*86400000}state.cards[q.id]=r;record(q,score>0);save()}
function record(q,good){const r=state.records[q.id]||{right:0,wrong:0,last:0};if(good)r.right++;else r.wrong++;r.last=Date.now();state.records[q.id]=r;save()}
function pageRef(q){return `${q.lecture==='V'?'Wykład V':'Wykład VI'} · slajd${/[,-]/.test(String(q.slide))?'y':''} ${esc(q.slide)}`}
function sideStats(){const n=CARDS.filter(mastered).length;const d=dueCards().length;$('side-stats').textContent=`${n}/${CARDS.length} fiszek opanowanych · ${d} do powtórki`;$('side-progress').style.width=`${n/CARDS.length*100}%`;$('storage-indicator').textContent=persistent?'● Dane na urządzeniu':'⚠ Zapis niedostępny'}
function nav(){const html=NAV.map(([id,label,icon])=>`<button type="button" class="navitem ${route===id?'active':''}" data-action="nav" data-mode="${id}"><span class="navico">${icon}</span><span>${label}</span></button>`).join('');$('desktop-nav').innerHTML=html;const mobile=[['home','Start','⌂'],['flash','Fiszki','▤'],['quiz','Quiz','☑'],['exam','Egzamin','◷'],['more','Więcej','☰']];$('mobile-nav').innerHTML=mobile.map(([id,l,i])=>`<button data-action="${id==='more'?'mobileMore':'nav'}" data-mode="${id}" class="${route===id?'active':''}" aria-label="${l}"><span class="mi">${i}</span>${l}</button>`).join('');$('mobile-menu').innerHTML=NAV.slice(3).map(([id,l,i])=>`<button data-action="nav" data-mode="${id}">${i}&nbsp; ${esc(l)}</button>`).join('');$('mobile-menu').classList.toggle('hidden',!mobileMenu)}
function section(title,right=''){return `<div class="section-head"><h2>${title}</h2>${right}</div>`}
function render(){nav();sideStats();$('crumb').textContent=ROUTE_NAMES[route]||'Sesja';if(session&&route==='session'){$('root').innerHTML=renderSession();return}if(route==='results'&&finished){$('root').innerHTML=renderResults();return}let html='';switch(route){case'home':html=renderHome();break;case'flash':case'quiz':case'recall':case'case':html=renderModeLanding(route);break;case'exam':html=renderExamStart();break;case'hard':html=renderHard();break;case'catalog':html=renderCatalog();break;case'coverage':html=renderCoverage();break;case'gallery':html=renderGallery();break;case'settings':html=renderSettings();break;default:html=renderHome()}$('root').innerHTML=html}
function renderHome(){const covered=CARDS.filter(mastered).length, due=dueCards().length, attempts=QUIZZES.reduce((n,q)=>n+getRec(q).right+getRec(q).wrong,0);let html=`<div class="eyebrow">TWOJE CENTRUM NAUKI</div><h1>Ucz się aktywnie.<br>Zapamiętaj na egzamin.</h1><p class="lead">${CARDS.length} fiszek, ${QUIZZES.length} pytań testowych, ${OPENS.length} pytań otwartych i ${CASES.length} scenariuszy — opracowanych z obu prezentacji. Wszystko offline, ze źródłami na slajdach.</p><div class="grid metrics"><div class="panel metric"><div class="meta">Fiszki opanowane</div><div class="big">${covered}<span class="muted" style="font-size:17px"> / ${CARDS.length}</span></div><small>Co najmniej 2 poprawne powtórzenia</small></div><div class="panel metric"><div class="meta">Dziś do powtórki</div><div class="big">${due}</div><small>Fiszki wymagające powtórzenia</small></div><div class="panel metric"><div class="meta">Odpowiedzi testowe</div><div class="big">${attempts}</div><small>Zapisane próby testowe</small></div><div class="panel metric"><div class="meta">Ukończone sesje</div><div class="big">${state.sessions.length}</div><small>Historia zapisana lokalnie</small></div></div>`;
html+=`<div class="btn-row" style="margin:12px 0 20px"><button class="btn" data-action="start" data-mode="daily">▶ Powtórka dzienna (20 fiszek)</button><button class="btn secondary" data-action="nav" data-mode="exam">Próbny egzamin</button><button class="btn secondary" data-action="start" data-mode="priority">Sprint priorytetów (24 pytania)</button></div>${filterPanel()}`;
html+=section('Wybierz sposób nauki',`<span class="tag prime">11 tematów egzaminacyjnych</span>`);const qcards=[['flash','▤','Inteligentne fiszki','Przypomnij z pamięci i oceń odpowiedź. System planuje kolejną powtórkę.'],['quiz','☑','Quizy i sekwencje','ABCD, wielokrotny wybór, prawda/fałsz, kolejność etapów.'],['recall','✎','Odpowiedź własnymi słowami','Zapisz odpowiedź, poznaj wzór i oceń się samodzielnie.'],['case','♧','Przypadki praktyczne','Ćwicz rozpoznawanie sytuacji i właściwe decyzje na podstawie slajdów.']];html+=`<div class="grid two">${qcards.map(([id,ic,t,d])=>`<button class="panel quick-card" style="text-align:left;color:inherit;cursor:pointer" data-action="start" data-mode="${id}"><span class="qicon">${ic}</span><h3>${t}</h3><p>${d}</p><span class="go">Rozpocznij →</span></button>`).join('')}</div>`;
const v=CARDS.filter(x=>x.lecture==='V'),vi=CARDS.filter(x=>x.lecture==='VI');html+=section('Postęp w wykładach');html+=`<div class="grid two">${[[v,'Wykład V','Wady postawy',false],[vi,'Wykład VI','Rehabilitacja pulmonologiczna',true]].map(([list,k,sub,alt])=>{const m=list.filter(mastered).length;return `<div class="panel card-lect ${alt?'alt':''}"><div class="tag">${k}</div><h3 style="margin:12px 0 3px">${sub}</h3><div class="sm muted">${m}/${list.length} fiszek opanowanych</div><div class="progressline"><i style="width:${m/list.length*100}%"></i></div><div style="margin-top:13px"><button class="btn small secondary" data-action="setlecture" data-lecture="${alt?'VI':'V'}">Ucz się z tego wykładu</button></div></div>`}).join('')}</div>`;
html+=`<div class="notice" style="margin-top:19px"><strong>Zakres źródeł</strong>W prezentacjach nie wyjaśniono terminu „RAJS” ani etapów przy stwardnieniu. Pozostałe niepełne zagadnienia oznaczyłem w zakładce „Zakres egzaminu”. Przykłady kliniczne służą wyłącznie do nauki materiału wykładowego.</div>`;return html}
function renderModeLanding(mode){const cfg={flash:['Fiszki z powtórkami','Najpierw przywołaj odpowiedź z pamięci, następnie oceń jej znajomość. Trudniejsze wracają częściej.',CARDS.length],quiz:['Sprawdź się w quizie','Pytania ABCD, wielokrotnego wyboru, prawda/fałsz oraz układanie etapów w kolejności.',QUIZZES.length],recall:['Odpowiedz własnymi słowami','Zapisz odpowiedź bez podglądania materiału. Po odsłonięciu porównaj najważniejsze punkty i ocenę.',OPENS.length],case:['Rozwiąż sytuacje praktyczne','Opis sytuacji jest ćwiczeniem dydaktycznym; wnioski wynikają z treści wykładów.',CASES.length]}[mode];const pool=available(({flash:CARDS,quiz:QUIZZES,recall:OPENS,case:CASES})[mode]);let h=`<div class="eyebrow">TRYB NAUKI</div><h1>${cfg[0]}</h1><p class="lead">${cfg[1]}</p>${filterPanel()}<div class="grid two"><div class="panel"><div class="tag prime">${pool.length} dostępnych pytań</div><h2 style="margin-top:13px">Sesja nauki</h2><p class="sm">Pytania są dobierane z aktywnych filtrów. Nie są powielane w jednej sesji, z wyjątkiem fiszek ocenionych jako „Nie pamiętam”.</p><div class="btn-row"><button class="btn" data-action="start" data-mode="${mode}">Rozpocznij sesję</button>${mode==='flash'?'<button class="btn secondary" data-action="start" data-mode="daily">Dzisiejsze powtórki</button>':''}</div></div><div class="panel"><h3>Jak się uczyć?</h3>${mode==='flash'?'<p>Odsłoń odpowiedź dopiero po samodzielnej próbie. „Nie pamiętam” odkłada fiszkę na krótką powtórkę, „Bardzo łatwe” wydłuża odstęp.</p>':mode==='quiz'?'<p>W pytaniach wielokrotnego wyboru zaznacz wszystkie poprawne odpowiedzi. Przy układaniu kroków korzystaj ze strzałek ↑ ↓.</p>':mode==='recall'?'<p>Porównuj nie brzmienie słów, lecz obecność kluczowych elementów. Pytania otwarte oceniasz samodzielnie.</p>':'<p>Najpierw zapisz decyzję, dopiero później wyświetl schemat odpowiedzi. Nie uzupełniaj go wiedzą spoza źródeł jako wiedzą z wykładu.</p>'}<div class="tag">Źródło pod każdym pytaniem</div></div></div>`;re function renderExamStart(){const pool=[...QUIZZES,...OPENS,...CASES].filter(q=>matches(q,{lecture:filters.lecture,topic:'all',difficulty:'all',priority:false}));return `<div class="eyebrow">SYMULTANICZNY EGZAMIN</div><h1>Sprawdź gotowość</h1><p class="lead">Zestaw bez powtórzeń, z opcjonalnym limitem czasu. Pytania testowe ocenia aplikacja, a odpowiedzi otwarte i przypadki oceniasz po porównaniu z wzorem.</p><div class="panel" style="max-width:760px"><div class="grid two"><div class="field"><label for="exam-lecture">Wybierz materiał</label><select id="exam-lecture">${opt('both','Oba wykłady','both')}${opt('V','Tylko wykład V','both')}${opt('VI','Tylko wykład VI','both')}</select></div><div class="field"><label for="exam-type">Rodzaj pytań</label><select id="exam-type">${opt('mixed','Mieszane','mixed')}${opt('open','Wyłącznie otwarte i scenariusze','mixed')}${opt('test','Tylko automatycznie oceniane','mixed')}</select></div><div class="field"><label for="exam-size">Liczba pytań</label><select id="exam-size">${opt('10','10', '20')}${opt('20','20','20')}${opt('40','40','20')}</select></div><div class="field"><label for="exam-time">Limit czasu</label><select id="exam-time">${opt('0','Bez limitu','0')}${opt('10','10 minut','0')}${opt('20','20 minut','0')}${opt('40','40 minut','0')}</select></div></div><p class="sm" style="margin-top:16px">Baza: ${pool.length} pytań w obu wykładach. Gdy filtr zapewnia mniej pytań niż wybrana liczba, sesja obejmie wszystkie dostępne bez powtarzania.</p><button class="btn" data-action="beginExam">Rozpocznij egzamin →</button></div><div class="notice" style="margin-top:17px;max-width:760px"><strong>Ocena wyników</strong>Wynik procentowy liczymy wyłącznie z pytań automatycznych. Odpowiedzi otwarte i sytuacje praktyczne mają osobny wynik samooceny. Prawidłowe odpowiedzi testowe w egzaminie są pokazywane na końcu.</div>`}
function renderHard(){

const d=available(hard), saved=available(ALL.filter(q=>state.bookmarks.includes(q.id)));

function scorePriority(q){const r=getRec(q),sum=r.right+r.wrong;const c=state.cards[q.id];return (sum===0?2:0)+r.wrong/(sum+1)*3+(c?.due<=Date.now()?2:0)+(q.difficulty==='hard'?.4:0);}

}

iv><div class="notice" style="margin-top:16px"><strong>Ważne</strong>Jeśli otwierasz plik HTML w innej przeglądarce, wcześniejsze postępy nie przeniosą się automatycznie. Użyj eksportu i importu. Jeśli przeglądarka blokuje localStorage dla plików lokalnych, eksport JSON jest jedyną trwałą kopią.</div>`}
function startMode(mode,itemsOverride=null){let pool=[];if(itemsOverride)pool=itemsOverride;else if(mode==='daily')pool=bestCards(available(CARDS),20,true);else if(mode==='flash')pool=bestCards(available(CARDS),25,false);else if(mode==='quiz')pool=randShuffle(available(QUIZZES)).slice(0,16);else if(mode==='recall')pool=randShuffle(available(OPENS)).slice(0,12);else if(mode==='case')pool=randShuffle(available(CASES)).slice(0,10);else if(mode==='priority')pool=randShuffle(available(ALL).filter(q=>q.priority)).sort((a,b)=>scorePriority(b)-scorePriority(a)).slice(0,24);else if(mode==='saved')pool=randShuffle(available(ALL).filter(q=>bookmarked(q))).slice(0,35);else if(mode==='review')pool=randShuffle(available(ALL).filter(q=>{const r=getRec(q);return r.wrong>0||(q.kind==='card'&&(state.cards[q.id]?.ease||2.5)<2.25)})).slice(0,25);
 if(!pool.length){toast('Brak dostępnych pytań dla wybranych filtrów.');return}
 session={mode,items:[...pool],index:0,phase:'ask',chosen:[],order:[],draft:'',results:[],isExam:false,retryIds:[],start:Date.now(),deadline:0,lecture:filters.lecture};route='session';prepareQuestion();render();window.scrollTo(0,0)}
function balancedMix(pool,n){let groups={quiz:randShuffle(pool.filter(q=>q.kind==='quiz')),open:randShuffle(pool.filter(q=>q.kind==='open')),case:randShuffle(pool.filter(q=>q.kind==='case'))};let out=[],pattern=['quiz','quiz','open','quiz','case','quiz','open','quiz','case','quiz'];for(let i=0;out.length<n&&i<4*n;i++){let kind=pattern[i%pattern.length];if(groups[kind].length)out.push(groups[kind].pop());else{let any=Object.values(groups).find(g=>g.length);if(!any)break;out.push(any.pop())}}return randShuffle(out)}
function startExam(){const lecture=$('exam-lecture').value,which=$('exam-type').value,size=Number($('exam-size').value),limit=Number($('exam-time').value);const pool=[...QUIZZES,...OPENS,...CASES].filter(q=>(lecture==='both'||q.lecture===lecture)&&(which==='mixed'||(which==='open'?(q.kind==='open'||q.kind==='case'):q.kind==='quiz')));
const selected=which==='mixed'?balancedMix(pool,size):randShuffle(pool).slice(0,size);if(!selected.length){toast('Brak pytań dla wybranej konfiguracji.');return}if(selected.length<size)toast(`Dostępne jest ${selected.length} unikalnych pytań. Nie powielam ich.`);
 session={mode:'exam',items:selected,index:0,phase:'ask',chosen:[],order:[],draft:'',results:[],isExam:true,retryIds:[],start:Date.now(),deadline:limit?Date.now()+limit*60000:0,lecture};route='session';prepareQuestion();render();window.scrollTo(0,0)}
function prepareQuestion(){if(!session)return;session.phase='ask';session.chosen=[];session.draft='';const q=session.items[session.index];session.order=q?.qtype==='order'?randShuffle(q.options.map((_,i)=>i)):[]}
function currentQ(){return session?.items[session.index]}
function scoreCard(value){if(!session||session.phase!=='revealed')return;let q=currentQ();if(q.kind!=='card')return;const good=value!==0;recStep(q,value);session.results.push({id:q.id,lecture:q.lecture,kind:q.kind,good,review:value,question:q.question});if(value===0&&!session.retryIds.includes(q.id)&&session.items.length<60){session.retryIds.push(q.id);session.items.push(q)}nextQuestion()}
function evaluateQuiz(q){if(q.qtype==='order'){return JSON.stringify(session.order)===JSON.stringify(q.options.map((_,i)=>i))}if(q.qtype==='tf')return session.chosen.length===1&&String(session.chosen[0])===String(q.correct);if(q.qtype==='single')return session.chosen.length===1&&Number(session.chosen[0])===Number(q.correct);if(q.qtype==='multi')return session.chosen.length===q.correct.length&&q.correct.every(k=>session.chosen.includes(k));return false}
function hasSelection(q){return q.qtype==='order'||session.chosen.length>0}
function checkQuiz(){if(!session||session.phase!=='ask')return;const q=currentQ();if(q.kind!=='quiz'||!hasSelection(q))return;const good=evaluateQuiz(q);session.results.push({id:q.id,lecture:q.lecture,kind:q.kind,good,question:q.question,correctText:correctQuizText(q),why:q.why});record(q,good);if(session.isExam){nextQuestion()}else{session.phase='feedback';render()}}
function correctQuizText(q){if(q.qtype==='tf')return q.correct?'Prawda':'Fałsz';if(q.qtype==='order')return q.options.join(' → ');if(q.qtype==='single')return q.options[q.correct];if(q.qtype==='multi')return q.correct.map(i=>q.options[i]).join(' · ');return ''}
function revealAnswer(){if(!session||session.phase!=='ask')return;let q=currentQ();if(q.kind==='quiz')return;session.phase='revealed';render()}
function gradeOpen(value){if(!session||session.phase!=='revealed')return;const q=currentQ();if(q.kind!=='open'&&q.kind!=='case')return;const good=value>=1;record(q,good);session.results.push({id:q.id,lecture:q.lecture,kind:q.kind,good,self:value,question:q.question,correctText:q.answer,why:q.pitfall});nextQuestion()}

function finishSession(timeout=false){if(!session)return;if(timeout){for(let i=session.index;i<session.items.length;i++){let q=session.items[i];session.results.push({id:q.id,lecture:q.lecture,kind:q.kind,good:false,unanswered:true,question:q.question,correctText:q.kind==='quiz'?correctQuizText(q):q.answer,why:q.why||q.pitfall||''})}}
let results=[...session.results],auto=results.filter(x=>x.kind==='quiz'),self=results.filter(x=>x.kind==='open'||x.kind==='case'),wrong=results.filter(x=>!x.good);const s={time:Date.now(),mode:session.mode,lecture:session.lecture,items:session.items.length,autoCorrect:auto.filter(x=>x.good).length,autoTotal:auto.length,selfGood:self.filter(x=>x.good&&!x.unanswered).length,selfTotal:self.length,wrongIds:wrong.map(x=>x.id)};state.sessions.push(s);if(state.sessions.length>100)state.sessions.shift();save();finished={summary:s,results,timeout,duration:Date.now()-session.start};session=null;route='results';render();window.scrollTo(0,0)}

function renderFlash(q){let h='';if(session.phase==='ask'){h=`<div class="answerbox" style="text-align:center"><p class="sm muted">Najpierw przypomnij sobie odpowiedź bez podpowiedzi.</p><button class="btn" data-action="reveal">Pokaż odpowiedź <span>⤵</span></button></div>`}else{h=`<div class="answerbox"><strong>Odpowiedź</strong><p>${esc(q.answer)}</p><div style="margin:19px 0 10px;font-size:12px;color:var(--soft)">Na ile dobrze udało Ci się odpowiedzieć?</div><div class="rate-grid">${[['0','Nie pamiętam','Wróci pod koniec sesji','again'],['1','Trudne','Powtórz jutro',''],['2','Pamiętam','Dłuższy odstęp',''],['3','Bardzo łatwe','Najdłuższy odstęp','easy']].map(([v,t,sub,c])=>`<button class="ratebtn ${c}" data-action="rate" data-grade="${v}">${t}<small>${sub}</small></button>`).join('')}</div></div>`}return h}
function renderQuiz(q){let h='<div class="options">';if(q.qtype==='order'){h=`<div class="sm muted">Ustaw etapy we właściwej kolejności (przyciskami ↑ ↓).</div>`+session.order.map((idx,pos)=>`<div class="orderrow"><span class="tag">${pos+1}</span><span>${esc(q.options[idx])}</span><span class="orderbtns"><button data-action="move" data-pos="${pos}" data-delta="-1" aria-label="Przesuń etap w górę" ${pos===0||session.phase==='feedback'?'disabled':''}>↑</button><button data-action="move" data-pos="${pos}" data-delta="1" aria-label="Przesuń etap w dół" ${pos===session.order.length-1||session.phase==='feedback'?'disabled':''}>↓</button></span></div>`).join('');}else if(q.qtype==='tf'){h+=['true','false'].map((v,i)=>`<button class="option ${session.chosen.includes(v)?'selected':''}" data-action="choose" data-idx="${v}" aria-pressed="${session.chosen.includes(v)}" ${session.phase==='feedback'?'disabled':''}><span class="letter">${i===0?'P':'F'}</span><span>${i===0?'Prawda':'Fałsz'}</span></button>`).join('')}else{h+=q.options.map((v,i)=>{const isSelected=session.chosen.includes(i);const good=q.qtype==='single'?q.correct===i:q.correct.includes(i);return `<button class="option ${isSelected?'selected':''} ${session.phase==='feedback'&&good?'correct':''} ${session.phase==='feedback'&&isSelected&&!good?'incorrect':''}" data-action="choose" data-idx="${i}" aria-pressed="${isSelected}" ${session.phase==='feedback'?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(v)}</span>${q.qtype==='multi'?`<span style="margin-left:auto">${isSelected?'☑':'□'}</span>`:''}</button>`}).join('')}if(q.qtype!=='order')h+='</div>';else h+='<div style="margin-bottom:17px"></div>';

function renderWritten(q){if(session.phase==='ask')return `<textarea class="textarea" id="written-answer" placeholder="Zapisz własną odpowiedź z pamięci…" aria-label="Twoja odpowiedź">${esc(session.draft)}</textarea><div class="btn-row" style="margin-top:12px"><button class="btn" data-action="reveal">Porównaj z odpowiedzią wzorcową</button><span class="sm muted">Nie oceniam dosłownego brzmienia.</span></div>`;

function renderResults(){const s=finished.summary, wrong=finished.results.filter(x=>!x.good), scored=s.autoTotal?Math.round(100*s.autoCorrect/s.autoTotal):null;let h=`<div class="eyebrow">KONIEC SESJI</div><h1>${finished.timeout?'Czas upłynął':'Podsumowanie nauki'}</h1><p class="lead">Przerobiono ${finished.results.length} odpowiedzi z ${s.items} przygotowanych pytań. Błędne tematy trafiły do zakładki powtórek.</p><div class="grid metrics"><div class="panel metric"><div class="meta">Wynik automatyczny</div><div class="big">${scored===null?'–':scored+'%'}</div><small>${s.autoCorrect}/${s.autoTotal} poprawnych testowych</small></div><div class="panel metric"><div class="meta">Samoocena odpowiedzi otwartych</div><div class="big">${s.selfTotal?Math.round(100*s.selfGood/s.selfTotal)+'%':'–'}</div><small>${s.selfGood}/${s.selfTotal} częściowo lub poprawnie</small></div><div class="panel metric"><div class="meta">Pytania wymagające powtórki</div><div class="big">${wrong.length}</div><small>W tym pominięte pytania</small></div><div class="panel metric"><div class="meta">Czas sesji</div><div class="big">${Math.round(finished.duration/60000)} min</div><small>Sesja zapisana lokalnie</small></div></div>`;

function clickAction(e){const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;if(a==='nav'){handleNav(btn.dataset.mode);return}if(a==='mobileMore'){mobileMenu=!mobileMenu;nav();return}if(a==='start'){startMode(btn.dataset.mode);return}if(a==='bookmark'){toggleBookmark(btn.dataset.id);return}if(a==='single'){const q=ALL.find(x=>x.id===btn.dataset.id);if(q)startMode(q.kind==='card'?'flash':q.kind==='quiz'?'quiz':q.kind==='open'?'recall':'case',[q]);return}if(a==='moreCatalog'){catalogFilters.limit+=24;refreshCatalog();return}if(a==='setlecture'){filters.lecture=btn.dataset.lecture;filters.topic='all';handleNav('flash');return}if(a==='beginExam'){startExam();return}if(a==='reveal'){revealAnswer();return}if(a==='rate'){scoreCard(Number(btn.dataset.grade));return}if(a==='choose'){chooseQuizOption(btn);return}if(a==='move'){if(!session||session.phase!=='ask')return;const pos=Number(btn.dataset.pos),dest=pos+Number(btn.dataset.delta);if(dest<0||dest>=session.order.length)return;[session.order[pos],session.order[dest]]=[session.order[dest],session.order[pos]];render();return}if(a==='checkQuiz'){checkQuiz();return}if(a==='next'){nextQuestion();return}if(a==='gradeOpen'){gradeOpen(Number(btn.dataset.grade));return}if(a==='exitSession'){if(session?.isExam&&confirm('Zakończyć egzamin teraz? Pozostałe pytania będą oznaczone jako pominięte.'))finishSession(true);else if(session&&!session.isExam)finishSession();return}if(a==='export'){downloadJSON();return}if(a==='import'){$('import-file').click();return}if(a==='reset'){if(confirm('Czy na pewno wyczyścić WSZYSTKIE postępy i historię?')){const theme=state.theme;state=safeState(null);state.theme=theme;save();render();toast('Wyzerowano postępy.')}return}}
document.addEventListener('click',clickAction);
document.addEventListener('input',(e)=>{if(e.target.id==='written-answer'&&session)session.draft=e.target.value;else if(e.target.id==='catalog-search'){catalogFilters.search=e.target.value;catalogFilters.limit=24;refreshCatalog()}});
document.addEventListener('change',e=>{if(e.target.id==='filter-lecture'){filters.lecture=e.target.value;render()}else if(e.target.id==='filter-topic'){filters.topic=e.target.value;render()}else if(e.target.id==='filter-difficulty'){filters.difficulty=e.target.value;render()}else if(e.target.id==='filter-priority'){filters.priority=e.target.checked;render()}else if(e.target.id==='catalog-lecture'){catalogFilters.lecture=e.target.value;catalogFilters.limit=24;refreshCatalog()}else if(e.target.id==='catalog-kind'){catalogFilters.kind=e.target.value;catalogFilters.limit=24;refreshCatalog()}else if(e.target.id==='catalog-priority'){catalogFilters.priority=e.target.checked;catalogFilters.limit=24;refreshCatalog()}});
document.addEventListener('keydown',e=>{if(!session||route!=='session'||e.altKey||e.metaKey)return;const t=e.target.tagName.toLowerCase();if(t==='button'&&(e.key==='Enter'||e.code==='Space'))return;if(t==='textarea'||t==='input'||t==='select'){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();revealAnswer()}return}const q=currentQ();if(!q)return;if(e.code==='Space'&&q.kind==='card'){e.preventDefault();if(session.phase==='ask')revealAnswer();return}if(q.kind==='card'&&session.phase==='revealed'&&['1','2','3','4'].includes(e.key)){e.preventDefault();scoreCard(Number(e.key)-1);return}if(q.kind==='quiz'&&session.phase==='ask'){if(e.key==='Enter'){e.preventDefault();checkQuiz();return}if(['1','2','3','4'].includes(e.key)&&q.qtype!=='order'){let b=q.qtype==='tf'?(e.key==='1'?'true':e.key==='2'?'false':null):q.options[Number(e.key)-1]!==undefined?Number(e.key)-1:null;if(b!==null){e.preventDefault();selectQuizOption(q,b);render()}}}});
$('theme-toggle').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';setTheme();save()});
$('import-file').addEventListener('change',async(e)=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>4e6)throw Error('Plik zbyt duży.');const raw=JSON.parse(await file.text());if(raw.version!==1||!raw.cards||!raw.records)throw Error('Nieprawidłowy plik postępów.');if(!confirm('Zaimportować postępy? Bieżące postępy zostaną zastąpione.'))return;state=safeState(raw);setTheme();save();render();toast('Zaimportowano postępy.')}catch(err){toast('Nie udało się zaimportować: '+err.message)}});
setInterval(()=>{if(session?.deadline){const left=session.deadline-Date.now();const ele=$('remaining');if(ele)ele.textContent=formatTime(left);if(left<=0&&session)finishSession(true)}},1000);
render();

</script>
</body>
</html>
