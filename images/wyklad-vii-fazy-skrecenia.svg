<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0 0 720 462" role="img" aria-labelledby="title desc">
  <title id="title">Fazy usprawniania po skręceniu stawu skokowego</title>
  <desc id="desc">Na slajdzie 95 faza ostra obejmuje chód z odciążeniem. W fazie podostrej stopniowo zwiększa się obciążanie. Faza zaawansowana obejmuje pełne obciążanie podczas chodu i propriocepcję.</desc>
  <rect width="720" height="462" fill="#f3faf9"/>
  <path d="M42 79v300" stroke="#81b6ae" stroke-width="5" stroke-linecap="round"/>
  <g fill="#fff" stroke="#c7e3df" stroke-width="2">
    <rect x="70" y="18" width="632" height="130" rx="20"/>
    <rect x="70" y="166" width="632" height="130" rx="20"/>
    <rect x="70" y="314" width="632" height="130" rx="20"/>
  </g>
  <g fill="#0f766e" stroke="#f3faf9" stroke-width="5">
    <circle cx="42" cy="83" r="13"/>
    <circle cx="42" cy="231" r="13"/>
    <circle cx="42" cy="379" r="13"/>
  </g>
  <g fill="#132c3d" font-family="system-ui, sans-serif">
    <g font-size="27" font-weight="700">
      <text x="94" y="52">Faza ostra</text>
      <text x="94" y="200">Faza podostra</text>
      <text x="94" y="348">Faza zaawansowana</text>
    </g>
    <g fill="#0d645d" font-size="23" font-weight="650" text-anchor="end">
      <text x="678" y="52">Do 2 tyg.</text>
      <text x="678" y="200">3–6 tyg.</text>
      <text x="678" y="348">Ponad 6 tyg.</text>
    </g>
    <g font-size="24">
      <text x="94" y="89">Chód z odciążeniem</text>
      <text x="94" y="122">RICE i ruch w granicy tolerancji</text>
      <text x="94" y="237">Stopniowe zwiększanie obciążania</text>
      <text x="94" y="270">Praca nad ruchem i równowagą</text>
      <text x="94" y="385">Pełne obciążanie podczas chodu</text>
      <text x="94" y="418">Propriocepcja, stabilizacja i koordynacja</text>
    </g>
  </g>
</svg>
